<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="TAT Studio - ผู้พัฒนาเกม Indie สัญชาติไทย">
  <meta name="theme-color" content="#0D0D0D">
  <title>TAT Studio — เกมไทย Indie</title>

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%23FF6B00'/><text x='50' y='60' font-size='60' font-weight='bold' fill='%23000' text-anchor='middle'>T</text></svg>">

  <link rel="canonical" href="https://www.timeandtime.online/">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap');

    :root {
      --bg: #0D0D0D;
      --bg-card: #111111;
      --bg-subtle: #161616;
      --bg-hover: #1a1a1a;
      --border: #242424;
      --border-mid: #303030;
      --border-hover: #FF6B00;
      --accent: #FF6B00;
      --accent-dim: rgba(255, 107, 0, 0.10);
      --accent-muted: rgba(255, 107, 0, 0.06);
      --status-demo: #FF6B00;
      --status-release: #22C55E;
      --status-soon: #6B7280;
      --text: #E2E2E2;
      --text-sec: #A0A0A0;
      --text-muted: #6B6B6B;
      --text-dim: #404040;
      --radius: 10px;
      --radius-sm: 6px;
      --radius-xs: 4px;
      --max-w: 1080px;
      --nav-h: 60px;
      --section-gap: 80px;
      --card-pad: 24px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; -webkit-font-smoothing: antialiased; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Inter", system-ui, sans-serif;
      font-size: 0.9375rem;
      line-height: 1.6;
    }
    h1, h2, h3 {
      font-family: "Space Grotesk", sans-serif;
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.25;
    }
    h4, h5, h6, label, .label { font-family: "Inter", sans-serif; font-weight: 500; }
    a { color: inherit; text-decoration: none; }
    img { display: block; max-width: 100%; }
    svg { flex-shrink: 0; }

    .icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1em;
      height: 1em;
      vertical-align: middle;
    }
    .icon svg { width: 100%; height: 100%; }
    .icon-sm  { width: 0.875rem; height: 0.875rem; }
    .icon-md  { width: 1.125rem; height: 1.125rem; }
    .icon-lg  { width: 1.5rem; height: 1.5rem; }
    .icon-xl  { width: 2rem; height: 2rem; }
    .icon-2xl { width: 2.5rem; height: 2.5rem; }

    .navbar {
      position: sticky;
      top: 0;
      z-index: 100;
      height: var(--nav-h);
      display: flex;
      align-items: center;
      padding: 0 24px;
      background: rgba(13, 13, 13, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }
    .navbar-inner {
      width: 100%;
      max-width: var(--max-w);
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 32px;
    }
    .nav-logo {
      font-family: "Space Grotesk", sans-serif;
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: -0.01em;
      color: var(--text);
    }
    .nav-logo span { color: var(--accent); }
    .nav-links {
      display: flex;
      gap: 4px;
      margin-left: auto;
      list-style: none;
    }
    .nav-links a {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: var(--radius-sm);
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text-sec);
      transition: color 0.15s, background 0.15s;
    }
    .nav-links a:hover,
    .nav-links a.active {
      color: var(--text);
      background: var(--bg-subtle);
    }
    .nav-links a.active { color: var(--accent); }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: var(--card-pad);
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .card:hover {
      border-color: var(--border-mid);
      box-shadow: 0 0 0 1px var(--border-mid);
    }
    .card.interactive:hover {
      border-color: var(--border-hover);
      box-shadow: 0 0 0 1px var(--accent-dim);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 18px;
      border-radius: var(--radius-sm);
      font-family: "Inter", sans-serif;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.15s, background 0.15s, border-color 0.15s;
      white-space: nowrap;
      border: 1px solid transparent;
    }
    .btn svg { width: 1rem; height: 1rem; }

    .btn-primary {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
    }
    .btn-primary:hover { opacity: 0.88; }

    .btn-secondary {
      background: var(--bg-subtle);
      color: var(--text);
      border-color: var(--border-mid);
    }
    .btn-secondary:hover { background: var(--bg-hover); border-color: var(--border-hover); }

    .btn-ghost {
      background: transparent;
      color: var(--accent);
      border-color: var(--border-mid);
    }
    .btn-ghost:hover { border-color: var(--accent); background: var(--accent-muted); }

    .btn-text {
      background: transparent;
      color: var(--text-sec);
      border-color: transparent;
      padding-left: 4px;
      padding-right: 4px;
    }
    .btn-text:hover { color: var(--text); }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 9px;
      border-radius: var(--radius-xs);
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      border: 1px solid transparent;
    }
    .badge-demo { color: var(--status-demo); background: rgba(255,107,0,0.10); border-color: rgba(255,107,0,0.20); }
    .badge-release { color: var(--status-release); background: rgba(34,197,94,0.10); border-color: rgba(34,197,94,0.20); }
    .badge-soon { color: var(--status-soon); background: rgba(107,114,128,0.12); border-color: rgba(107,114,128,0.20); }

    .tag {
      display: inline-flex;
      align-items: center;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--text-sec);
      background: var(--bg-subtle);
      border: 1px solid var(--border);
    }

    .divider {
      width: 100%;
      height: 1px;
      background: var(--border);
      margin: 32px 0;
    }

    .section {
      padding: var(--section-gap) 24px;
    }
    .section-inner {
      max-width: var(--max-w);
      margin: 0 auto;
    }
    .section-header {
      margin-bottom: 40px;
    }
    .section-header h2 {
      font-size: 1.75rem;
      color: var(--text);
    }
    .section-header p {
      margin-top: 8px;
      color: var(--text-sec);
      font-size: 0.9375rem;
    }
    .section-header-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }
    @media (max-width: 900px) { .grid-3 { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 600px) { .grid-3, .grid-2 { grid-template-columns: 1fr; } }

    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 80px 24px;
      background: linear-gradient(135deg, var(--bg-subtle) 0%, var(--bg) 100%);
      position: relative;
      overflow: hidden;
    }
    .hero::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 200px;
      background: linear-gradient(to bottom, transparent, rgba(13, 13, 13, 0.4));
      pointer-events: none;
    }
    .hero-inner {
      max-width: var(--max-w);
      text-align: center;
      z-index: 1;
      animation: fadeInUp 0.6s ease-out;
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(40px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .hero h1 {
      font-size: clamp(2.5rem, 8vw, 4rem);
      color: var(--text);
      margin-bottom: 12px;
    }
    .hero h1 .dot { color: var(--accent); }
    .hero .tagline {
      font-size: 1.25rem;
      color: var(--text-sec);
      margin-bottom: 32px;
    }
    .hero .counter {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 0.9375rem;
      color: var(--text-muted);
      margin-bottom: 40px;
    }
    .hero .counter strong { color: var(--accent); }
    .hero-buttons {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 40px;
    }

    .thumb {
      width: 100%;
      aspect-ratio: 16/9;
      background: var(--bg-subtle);
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      overflow: hidden;
    }
    .thumb img { width: 100%; height: 100%; object-fit: cover; }
    .thumb-placeholder {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      color: var(--text-dim);
    }
    .thumb-placeholder svg { width: 3rem; height: 3rem; }

    .featured-game {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
      align-items: center;
    }
    .featured-game-image { order: 2; }
    .featured-game-info { order: 1; }
    .featured-game h2 {
      font-size: 2rem;
      margin-bottom: 8px;
    }
    .featured-game .subtitle {
      font-size: 1.125rem;
      color: var(--text-sec);
      margin-bottom: 16px;
    }
    .featured-game .description {
      color: var(--text-sec);
      margin-bottom: 24px;
      line-height: 1.8;
    }
    .featured-game .buttons {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    @media (max-width: 900px) {
      .featured-game {
        grid-template-columns: 1fr;
        gap: 24px;
      }
      .featured-game-image { order: 1; }
      .featured-game-info { order: 2; }
    }

    .game-card {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .game-card-head {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .game-card-title {
      font-size: 1rem;
      font-weight: 600;
    }
    .game-card-desc {
      font-size: 0.875rem;
      color: var(--text-sec);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .game-card-tags {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .game-card-actions {
      display: flex;
      gap: 8px;
      margin-top: auto;
    }
    .game-card-actions .btn { flex: 1; justify-content: center; }

    .studio-bio {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
      align-items: center;
    }
    .studio-bio-info h3 {
      font-size: 1.5rem;
      margin-bottom: 8px;
    }
    .studio-bio-info .tagline {
      color: var(--text-sec);
      margin-bottom: 20px;
    }
    .studio-bio-info .description {
      color: var(--text-sec);
      margin-bottom: 24px;
      line-height: 1.8;
    }
    .studio-bio-links {
      display: flex;
      gap: 12px;
    }
    .studio-bio-links .btn { flex: 1; justify-content: center; }
    @media (max-width: 900px) {
      .studio-bio { grid-template-columns: 1fr; gap: 24px; }
      .studio-bio-image { order: -1; }
    }

    .link-card {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 20px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      transition: border-color 0.2s, background 0.2s;
    }
    .link-card:hover {
      border-color: var(--border-hover);
      background: var(--accent-muted);
    }
    .link-card-icon {
      width: 40px; height: 40px;
      display: flex; align-items: center; justify-content: center;
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      flex-shrink: 0;
    }
    .link-card-icon svg { width: 1.125rem; height: 1.125rem; color: var(--text-sec); }
    .link-card:hover .link-card-icon svg { color: var(--accent); }
    .link-card-text { flex: 1; }
    .link-card-name { font-weight: 600; font-size: 0.9375rem; color: var(--text); }
    .link-card-url { font-size: 0.8rem; color: var(--text-muted); }
    .link-card-arrow { color: var(--text-dim); }
    .link-card-arrow svg { width: 1rem; height: 1rem; }

    .fade { opacity: 0; transform: translateY(16px); transition: opacity 0.4s ease, transform 0.4s ease; }
    .fade.visible { opacity: 1; transform: none; }

    .footer {
      padding: 40px 24px;
      border-top: 1px solid var(--border);
      text-align: center;
      color: var(--text-muted);
      font-size: 0.8125rem;
    }
    .footer a { color: var(--text-sec); }
    .footer a:hover { color: var(--accent); }
  </style>
</head>

      youtube: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22.54 6.42a2.78 2.78 0 0 0-1.94-2C18.88 4 12 4 12 4s-6.88 0-8.6.46a2.78 2.78 0 0 0-1.94 2A29 29 0 0 0 1 11.75a29 29 0 0 0 .46 5.33A2.78 2.78 0 0 0 3.4 19c1.72.46 8.6.46 8.6.46s6.88 0 8.6-.46a2.78 2.78 0 0 0 1.94-2 29 29 0 0 0 .46-5.25 29 29 0 0 0-.46-5.33z"/><polygon points="9.75 15.02 15.5 11.75 9.75 8.48 9.75 15.02"/></svg>`,
      globe: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 1 10 4m0 12a14.5 14.5 0 0 1-10 4M2 12a14.5 14.5 0 0 0 10 4m0-12a14.5 14.5 0 0 0-10 4"/><line x1="2" y1="12" x2="22" y2="12"/></svg>`,
      link: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>`,
      taptap: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="4"/><circle cx="18" cy="18" r="4"/><path d="M10 8l4 4M14 16l-4-4"/></svg>`,
      itch: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 9v6M12 9v6M15 9v6"/></svg>`,
      gamepad: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="12" x2="12" y2="12"/><line x1="9" y1="9" x2="9" y2="15"/><circle cx="19" cy="13" r="1"/><circle cx="22" cy="10" r="1"/></svg>`,
      calendar: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>`,
      tag: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>`,
      image: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>`,
      release: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>`,
    };

    async function fetchJSON(url) {
      try {
        const r = await fetch(url);
        if (!r.ok) throw new Error(r.status);
        return await r.json();
      } catch (e) {
        console.error('[TAT]', url, e);
        return null;
      }
    }

    function badgeHtml(status) {
      const map = {
        demo: ['badge-demo', 'Demo'],
        released: ['badge-release', 'Released'],
        'coming-soon': ['badge-soon', 'Coming Soon'],
      };
      const [cls, label] = map[status] || map['coming-soon'];
      return `<span class="badge ${cls}">${label}</span>`;
    }

    function renderNav(studio) {
      const current = location.pathname.split('/').pop() || 'index.html';
      const logo = document.getElementById('nav-logo');
      logo.innerHTML = studio ? `${studio.shortName.split(' ')[0]}<span>.</span>` : 'TAT<span>.</span>';

      const ul = document.getElementById('nav-links');
      ul.innerHTML = SITE.nav.map((n, i) => `
        <li><a href="${n.href}" class="icon-md ${current === n.href ? 'active' : ''}">
          <span class="icon">${ICONS.home}</span> <span style="display:inline">${n.label}</span>
        </a></li>
      `).join('');
    }

    function renderFooter(studio) {
      const s = studio || { shortName: 'TAT Studio' };
      const footer = document.getElementById('footer');
      footer.innerHTML = `
        <p>&copy; ${new Date().getFullYear()} ${s.shortName}. All rights reserved.</p>
      `;
    }

    function initFade() {
      const obs = new IntersectionObserver(entries =>
        entries.forEach(e => e.isIntersecting && e.target.classList.add('visible')),
        { threshold: 0.1 }
      );
      document.querySelectorAll('.fade').forEach(el => obs.observe(el));
    }

    async function init() {
      const studio = await fetchJSON(SITE.dataUrl.studio);
      const games = await fetchJSON(SITE.dataUrl.games);

      if (studio) renderNav(studio);
      if (studio) renderFooter(studio);

      if (games && games.length > 0) {
        const counter = document.getElementById('hero-counter');
        counter.innerHTML = `<span class="icon icon-md">${ICONS.gamepad}</span> <strong>${games.length}</strong> เกม`;

        const featured = games.find(g => g.isFeatured);
        if (featured) renderFeatured(featured);

        const latest = games.slice(0, 3);
        renderGames(latest, document.getElementById('games-preview'));
      }

      renderStudio(studio);
      initFade();
    }

    function renderFeatured(game) {
      const section = document.getElementById('featured-section');
      section.innerHTML = `
        <div class="section-inner">
          <div class="featured-game fade">
            <div class="featured-game-image">
              <div class="thumb">
                <div class="thumb-placeholder">${ICONS.image}</div>
              </div>
            </div>
            <div class="featured-game-info">
              <div class="featured-game-header">
                ${badgeHtml(game.status)}
              </div>
              <h2>${game.title}</h2>
              <p class="subtitle">${game.subtitle}</p>
              <p class="description">${game.description.th}</p>
              <div class="buttons">
                <button class="btn btn-primary" onclick="location.href = '${game.downloads[0]?.url || '#'}'">
                  <span class="icon">${ICONS.download}</span> ดาวน์โหลด
                </button>
                <button class="btn btn-secondary" onclick="location.href = 'game.html?id=${game.id}'">
                  <span class="icon">${ICONS.arrowRight}</span> ดูรายละเอียด
                </button>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function renderGames(games, container) {
      container.innerHTML = games.map(g => `
        <div class="card fade">
          <div class="game-card">
            <div class="thumb">
              <div class="thumb-placeholder">${ICONS.image}</div>
            </div>
            <div class="game-card-head">
              ${badgeHtml(g.status)}
              <h3 class="game-card-title">${g.title}</h3>
              <p class="game-card-desc">${g.description.th}</p>
            </div>
            <div class="game-card-tags">
              ${g.tags.slice(0, 3).map(t => `<span class="tag">${t}</span>`).join('')}
            </div>
            <div class="game-card-actions">
              <button class="btn btn-primary" onclick="location.href = '${g.downloads[0]?.url || '#'}'">
                <span class="icon">${ICONS.download}</span> ดาวน์โหลด
              </button>
              <button class="btn btn-secondary" onclick="location.href = 'game.html?id=${g.id}'">
                <span class="icon">${ICONS.arrowRight}</span>
              </button>
            </div>
          </div>
        </div>
      `).join('');
    }

    function renderStudio(studio) {
      if (!studio) return;
      const section = document.getElementById('studio-section');
      section.innerHTML = `
        <div class="section-inner">
          <div class="studio-bio fade">
            <div class="studio-bio-image">
              <div class="thumb">
                <div class="thumb-placeholder">${ICONS.image}</div>
              </div>
            </div>
            <div class="studio-bio-info">
              <h3>${studio.name}</h3>
              <p class="tagline">${studio.tagline}</p>
              <p class="description">${studio.about}</p>
              <div style="display: flex; gap: 12px; margin-top: 24px; flex-wrap: wrap;">
                <a href="${studio.links.github}" target="_blank" rel="noopener" class="link-card" style="flex: 1;">
                  <div class="link-card-icon">${ICONS.github}</div>
                  <div class="link-card-text">
                    <div class="link-card-name">GitHub</div>
                    <div class="link-card-url">github.com</div>
                  </div>
                  <div class="link-card-arrow">${ICONS.externalLink}</div>
                </a>
                <a href="${studio.links.youtube}" target="_blank" rel="noopener" class="link-card" style="flex: 1;">
                  <div class="link-card-icon">${ICONS.youtube}</div>
                  <div class="link-card-text">
                    <div class="link-card-name">YouTube</div>
                    <div class="link-card-url">youtube.com</div>
                  </div>
                  <div class="link-card-arrow">${ICONS.externalLink}</div>
                </a>
              </div>
              <a href="about.html" class="btn btn-ghost" style="margin-top: 24px;">
                <span class="icon">${ICONS.arrowRight}</span> เกี่ยวกับเรา
              </a>
            </div>
          </div>
        </div>
      `;
    }

    init();
  </script>

  <nav class="navbar">
    <div class="navbar-inner">
      <div class="nav-logo" id="nav-logo">TAT<span>.</span></div>
      <ul class="nav-links" id="nav-links"></ul>
    </div>
  </nav>

  <section class="hero">
    <div class="hero-inner">
      <h1>TimeAndTime Studio<span class="dot">.</span></h1>
      <p class="tagline">ผู้พัฒนาเกม Indie ไทย</p>
      <div class="hero counter" id="hero-counter">
        <span class="icon">${ICONS.gamepad}</span> <strong>--</strong> เกม
      </div>
      <div class="hero-buttons">
        <button class="btn btn-primary" onclick="location.href='games.html'">
          <span class="icon">${ICONS.gamepad}</span> ดูเกมทั้งหมด
        </button>
        <button class="btn btn-secondary" onclick="document.querySelector('.section').scrollIntoView({ behavior: 'smooth' })">
          <span class="icon">${ICONS.arrowDown}</span> เลื่อนดู
        </button>
      </div>
    </div>
  </section>

  <section class="section" id="featured-section">
    <div class="section-inner"></div>
  </section>

  <section class="section">
    <div class="section-inner">
      <div class="section-header-row">
        <div class="section-header">
          <h2>เกมล่าสุด</h2>
          <p>ชมเกมใหม่จาก TAT Studio</p>
        </div>
        <a href="games.html" class="btn btn-text">
          ดูทั้งหมด <span class="icon">${ICONS.arrowRight}</span>
        </a>
      </div>
      <div class="grid-3" id="games-preview"></div>
    </div>
  </section>

  <section class="section" id="studio-section">
    <div class="section-inner"></div>
  </section>

  <footer class="footer" id="footer"></footer>
</body>
</html>
