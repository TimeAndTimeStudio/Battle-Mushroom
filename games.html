<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="เกมทั้งหมดจาก TAT Studio">
  <meta name="theme-color" content="#0D0D0D">
  <title>เกมทั้งหมด — TAT Studio</title>

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%23FF6B00'/><text x='50' y='60' font-size='60' font-weight='bold' fill='%23000'>T</text></svg>">
  <link rel="canonical" href="https://www.timeandtime.online/games.html">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap');

    :root {
      --bg: #0D0D0D;
      --bg-card: #111111;
      --bg-subtle: #161616;
      --bg-hover: #1a1a1a;
      --border: #242424;
      --border-mid: #303030;
      --border-hover: #FF6B00;
      --accent: #FF6B00;
      --accent-dim: rgba(255, 107, 0, 0.10);
      --accent-muted: rgba(255, 107, 0, 0.06);
      --status-demo: #FF6B00;
      --status-release: #22C55E;
      --status-soon: #6B7280;
      --text: #E2E2E2;
      --text-sec: #A0A0A0;
      --text-muted: #6B6B6B;
      --text-dim: #404040;
      --radius: 10px;
      --radius-sm: 6px;
      --radius-xs: 4px;
      --max-w: 1080px;
      --nav-h: 60px;
      --section-gap: 80px;
      --card-pad: 24px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; -webkit-font-smoothing: antialiased; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Inter", system-ui, sans-serif;
      font-size: 0.9375rem;
      line-height: 1.6;
    }
    h1, h2, h3 {
      font-family: "Space Grotesk", sans-serif;
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.25;
    }
    h4, h5, h6, label, .label { font-family: "Inter", sans-serif; font-weight: 500; }
    a { color: inherit; text-decoration: none; }
    img { display: block; max-width: 100%; }
    svg { flex-shrink: 0; }

    .icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1em;
      height: 1em;
      vertical-align: middle;
    }
    .icon svg { width: 100%; height: 100%; }

    .navbar {
      position: sticky;
      top: 0;
      z-index: 100;
      height: var(--nav-h);
      display: flex;
      align-items: center;
      padding: 0 24px;
      background: rgba(13, 13, 13, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }
    .navbar-inner {
      width: 100%;
      max-width: var(--max-w);
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 32px;
    }
    .nav-logo {
      font-family: "Space Grotesk", sans-serif;
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: -0.01em;
      color: var(--text);
    }
    .nav-logo span { color: var(--accent); }
    .nav-links {
      display: flex;
      gap: 4px;
      margin-left: auto;
      list-style: none;
    }
    .nav-links a {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: var(--radius-sm);
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text-sec);
      transition: color 0.15s, background 0.15s;
    }
    .nav-links a:hover,
    .nav-links a.active {
      color: var(--text);
      background: var(--bg-subtle);
    }
    .nav-links a.active { color: var(--accent); }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: var(--card-pad);
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .card:hover {
      border-color: var(--border-mid);
      box-shadow: 0 0 0 1px var(--border-mid);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 18px;
      border-radius: var(--radius-sm);
      font-family: "Inter", sans-serif;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.15s, background 0.15s, border-color 0.15s;
      white-space: nowrap;
      border: 1px solid transparent;
    }
    .btn svg { width: 1rem; height: 1rem; }

    .btn-primary {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
    }
    .btn-primary:hover { opacity: 0.88; }

    .btn-secondary {
      background: var(--bg-subtle);
      color: var(--text);
      border-color: var(--border-mid);
    }
    .btn-secondary:hover { background: var(--bg-hover); border-color: var(--border-hover); }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 9px;
      border-radius: var(--radius-xs);
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      border: 1px solid transparent;
    }
    .badge-demo { color: var(--status-demo); background: rgba(255,107,0,0.10); border-color: rgba(255,107,0,0.20); }
    .badge-release { color: var(--status-release); background: rgba(34,197,94,0.10); border-color: rgba(34,197,94,0.20); }
    .badge-soon { color: var(--status-soon); background: rgba(107,114,128,0.12); border-color: rgba(107,114,128,0.20); }

    .tag {
      display: inline-flex;
      align-items: center;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--text-sec);
      background: var(--bg-subtle);
      border: 1px solid var(--border);
    }

    .section {
      padding: var(--section-gap) 24px;
    }
    .section-inner {
      max-width: var(--max-w);
      margin: 0 auto;
    }
    .section-header {
      margin-bottom: 40px;
    }
    .section-header h2 {
      font-size: 1.75rem;
      color: var(--text);
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }
    @media (max-width: 900px) { .grid-3 { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 600px) { .grid-3 { grid-template-columns: 1fr; } }

    .filter-bar {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 32px;
    }
    .filter-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 16px;
      border-radius: 999px;
      font-size: 0.8125rem;
      font-weight: 500;
      color: var(--text-sec);
      background: transparent;
      border: 1px solid var(--border-mid);
      cursor: pointer;
      transition: color 0.15s, background 0.15s, border-color 0.15s;
    }
    .filter-btn:hover { color: var(--text); border-color: var(--border-hover); }
    .filter-btn.active { color: var(--accent); background: var(--accent-dim); border-color: var(--accent); }

    .thumb {
      width: 100%;
      aspect-ratio: 16/9;
      background: var(--bg-subtle);
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      overflow: hidden;
    }
    .thumb-placeholder {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      color: var(--text-dim);
    }
    .thumb-placeholder svg { width: 3rem; height: 3rem; }

    .game-card {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .game-card-title {
      font-size: 1rem;
      font-weight: 600;
    }
    .game-card-desc {
      font-size: 0.875rem;
      color: var(--text-sec);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .game-card-tags {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .game-card-actions {
      display: flex;
      gap: 8px;
      margin-top: auto;
    }
    .game-card-actions .btn { flex: 1; justify-content: center; }

    .fade { opacity: 0; transform: translateY(16px); transition: opacity 0.4s ease, transform 0.4s ease; }
    .fade.visible { opacity: 1; transform: none; }

    .footer {
      padding: 40px 24px;
      border-top: 1px solid var(--border);
      text-align: center;
      color: var(--text-muted);
      font-size: 0.8125rem;
    }
    .footer a { color: var(--text-sec); }
    .footer a:hover { color: var(--accent); }
  </style>
</head>
<body>
  <script>
    const SITE = {
      baseUrl: "https://www.timeandtime.online",
      dataUrl: {
        studio: "https://raw.githubusercontent.com/TimeAndTimeStudio/Battle-Mushroom/main/data/studio.json",
        games:  "https://raw.githubusercontent.com/TimeAndTimeStudio/Battle-Mushroom/main/data/games.json",
      },
      nav: [
        { label: "หน้าแรก",  href: "index.html"  },
        { label: "เกม",      href: "games.html"  },
        { label: "Devlog",   href: "devlog.html" },
        { label: "เกี่ยวกับ", href: "about.html" },
      ]
    };

    const ICONS = {
      gamepad: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="4"/><circle cx="18" cy="18" r="4"/><path d="M10 8l4 4M14 16l-4-4"/></svg>`,
      download: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>`,
      arrowRight: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>`,
      image: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>`,
    };

    async function fetchJSON(url) {
      try {
        const r = await fetch(url);
        if (!r.ok) throw new Error(r.status);
        return await r.json();
      } catch (e) {
        console.error('[TAT]', url, e);
        return null;
      }
    }

    function badgeHtml(status) {
      const map = {
        demo: ['badge-demo', 'Demo'],
        released: ['badge-release', 'Released'],
        'coming-soon': ['badge-soon', 'Coming Soon'],
      };
      const [cls, label] = map[status] || map['coming-soon'];
      return `<span class="badge ${cls}">${label}</span>`;
    }

    function renderNav(studio) {
      const current = location.pathname.split('/').pop() || 'index.html';
      const logo = document.getElementById('nav-logo');
      logo.innerHTML = studio ? `${studio.shortName.split(' ')[0]}<span>.</span>` : 'TAT<span>.</span>';

      const ul = document.getElementById('nav-links');
      ul.innerHTML = SITE.nav.map(n => `
        <li><a href="${n.href}" class="icon-md ${current === n.href ? 'active' : ''}">${n.label}</a></li>
      `).join('');
    }

    function renderFooter(studio) {
      const s = studio || { shortName: 'TAT Studio' };
      const footer = document.getElementById('footer');
      footer.innerHTML = `&copy; ${new Date().getFullYear()} ${s.shortName}. All rights reserved.`;
    }

    function renderGames(games, container) {
      container.innerHTML = games.map(g => `
        <div class="card fade" data-status="${g.status}">
          <div class="game-card">
            <div class="thumb">
              <div class="thumb-placeholder">${ICONS.image}</div>
            </div>
            <div>
              ${badgeHtml(g.status)}
              <h3 class="game-card-title">${g.title}</h3>
              <p class="game-card-desc">${g.description.th}</p>
            </div>
            <div class="game-card-tags">
              ${g.tags.slice(0, 3).map(t => `<span class="tag">${t}</span>`).join('')}
            </div>
            <div class="game-card-actions">
              <button class="btn btn-primary" onclick="location.href = '${g.downloads[0]?.url || '#'}'">
                <span class="icon">${ICONS.download}</span> ดาวน์โหลด
              </button>
              <button class="btn btn-secondary" onclick="location.href = 'game.html?id=${g.id}'">
                <span class="icon">${ICONS.arrowRight}</span>
              </button>
            </div>
          </div>
        </div>
      `).join('');
      initFade();
      initFilter();
    }

    function initFade() {
      const obs = new IntersectionObserver(entries =>
        entries.forEach(e => e.isIntersecting && e.target.classList.add('visible')),
        { threshold: 0.1 }
      );
      document.querySelectorAll('.fade').forEach(el => obs.observe(el));
    }

    function initFilter() {
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          const val = btn.dataset.status;
          document.querySelectorAll('[data-status]').forEach(el => {
            el.style.display = (val === 'all' || el.dataset.status === val) ? '' : 'none';
          });
        });
      });
    }

    async function init() {
      const studio = await fetchJSON(SITE.dataUrl.studio);
      const games = await fetchJSON(SITE.dataUrl.games);

      if (studio) renderNav(studio);
      if (studio) renderFooter(studio);

      if (games && games.length > 0) {
        renderGames(games, document.getElementById('games-grid'));
        document.querySelector('.filter-btn').click();
      }
    }

    init();
  </script>

  <nav class="navbar">
    <div class="navbar-inner">
      <div class="nav-logo" id="nav-logo">TAT<span>.</span></div>
      <ul class="nav-links" id="nav-links"></ul>
    </div>
  </nav>

  <section class="section">
    <div class="section-inner">
      <div class="section-header">
        <h2>เกมทั้งหมด</h2>
      </div>

      <div class="filter-bar">
        <button class="filter-btn active" data-status="all">ทั้งหมด</button>
        <button class="filter-btn" data-status="demo">Demo</button>
        <button class="filter-btn" data-status="released">Released</button>
        <button class="filter-btn" data-status="coming-soon">Coming Soon</button>
      </div>

      <div class="grid-3" id="games-grid"></div>
    </div>
  </section>

  <footer class="footer" id="footer"></footer>
</body>
</html>
