<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#FF6B00">
  <meta name="description" content="รู้จัก TAT Studio ทีมพัฒนาเกม Indie สัญชาติไทย">
  <meta property="og:image" content="https://img.tapimg.net/market/images/37f3779125fc38cf177bab91cd44da60.png">
  <link rel="canonical" href="https://www.timeandtime.online/about.html">
  <title>เกี่ยวกับเรา — TAT Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#0D0D0D;--bg-card:#111111;--bg-subtle:#161616;--bg-hover:#1a1a1a;--border:#242424;--border-mid:#303030;--border-hover:#FF6B00;--accent:#FF6B00;--accent-dim:rgba(255,107,0,.10);--accent-muted:rgba(255,107,0,.06);--status-demo:#FF6B00;--status-release:#22C55E;--status-soon:#6B7280;--text:#E2E2E2;--text-sec:#A0A0A0;--text-muted:#6B6B6B;--text-dim:#404040;--radius:10px;--radius-sm:6px;--radius-xs:4px;--max-w:1080px;--nav-h:60px;--section-gap:80px;--card-pad:24px}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{font-size:16px;-webkit-font-smoothing:antialiased}
    body{background:var(--bg);color:var(--text);font-family:"Inter",system-ui,sans-serif;font-size:.9375rem;line-height:1.6}
    h1,h2,h3{font-family:"Space Grotesk",sans-serif;font-weight:600;letter-spacing:-.02em;line-height:1.25}
    a{color:inherit;text-decoration:none}
    img{display:block;max-width:100%}
    svg{flex-shrink:0}
    .navbar{position:sticky;top:0;z-index:100;height:var(--nav-h);display:flex;align-items:center;padding:0 24px;background:rgba(13,13,13,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
    .navbar-inner{width:100%;max-width:var(--max-w);margin:0 auto;display:flex;align-items:center;gap:32px}
    .nav-logo{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:1rem;letter-spacing:-.01em;color:var(--text)}
    .nav-logo span{color:var(--accent)}
    .nav-links{display:flex;gap:4px;margin-left:auto;list-style:none}
    .nav-links a{display:flex;align-items:center;gap:6px;padding:6px 14px;border-radius:var(--radius-sm);font-size:.875rem;font-weight:500;color:var(--text-sec);transition:color .15s,background .15s}
    .nav-links a:hover,.nav-links a.active{color:var(--text);background:var(--bg-subtle)}
    .nav-links a.active{color:var(--accent)}
    .section{padding:var(--section-gap) 24px}
    .section-inner{max-width:var(--max-w);margin:0 auto}
    .footer{padding:40px 24px;border-top:1px solid var(--border);text-align:center;color:var(--text-muted);font-size:.8125rem}
    .footer a{color:var(--text-sec)}
    .footer a:hover{color:var(--accent)}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
    .skeleton{background:var(--bg-subtle);border-radius:var(--radius-sm);animation:pulse 1.6s ease-in-out infinite}
    .fade{opacity:0;transform:translateY(16px);transition:opacity .4s ease,transform .4s ease}
    .fade.visible{opacity:1;transform:none}
    .grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
    .grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
    @media(max-width:900px){.grid-3{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:600px){.grid-3,.grid-2{grid-template-columns:1fr}}
    .stat-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;text-align:center}
    .stat-number{font-family:"Space Grotesk",sans-serif;font-size:2.5rem;font-weight:700;color:var(--accent);line-height:1;margin-bottom:6px}
    .stat-label{font-size:.8125rem;font-weight:500;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em}
    .link-card{display:flex;align-items:center;gap:14px;padding:16px 20px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);transition:border-color .2s,background .2s}
    .link-card:hover{border-color:var(--border-hover);background:var(--accent-muted)}
    .link-card-icon{width:40px;height:40px;display:flex;align-items:center;justify-content:center;background:var(--bg-subtle);border:1px solid var(--border);border-radius:var(--radius-sm);flex-shrink:0}
    .link-card-icon svg{width:1.125rem;height:1.125rem;color:var(--text-sec)}
    .link-card:hover .link-card-icon svg{color:var(--accent)}
    .link-card-text{flex:1}
    .link-card-name{font-weight:600;font-size:.9375rem;color:var(--text)}
    .link-card-url{font-size:.8rem;color:var(--text-muted)}
    .link-card-arrow{color:var(--text-dim)}
    .link-card-arrow svg{width:1rem;height:1rem}
    .studio-logo-box{width:96px;height:96px;border-radius:var(--radius);background:var(--bg-subtle);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;margin-bottom:24px}
    .studio-logo-box svg{width:2.5rem;height:2.5rem;color:var(--text-muted)}
  </style>
</head>
<body>
<nav class="navbar">
  <div class="navbar-inner">
    <a href="index.html" class="nav-logo" id="nav-logo"><span>TAT</span> Studio</a>
    <ul class="nav-links" id="nav-links"></ul>
  </div>
</nav>

<section class="section">
  <div class="section-inner">
    <div id="studio-info">
      <div class="skeleton" style="height:300px;border-radius:var(--radius)"></div>
    </div>
  </div>
</section>

<section class="section" style="padding-top:0">
  <div class="section-inner">
    <h2 style="font-size:1.375rem;margin-bottom:24px">สถิติ</h2>
    <div class="grid-3 fade" id="stats-grid">
      <div class="skeleton" style="height:110px;border-radius:var(--radius)"></div>
      <div class="skeleton" style="height:110px;border-radius:var(--radius)"></div>
      <div class="skeleton" style="height:110px;border-radius:var(--radius)"></div>
    </div>
  </div>
</section>

<section class="section" style="padding-top:0;padding-bottom:var(--section-gap)">
  <div class="section-inner">
    <h2 style="font-size:1.375rem;margin-bottom:24px">ช่องทางติดต่อ</h2>
    <div class="grid-2 fade" id="links-grid">
      <div class="skeleton" style="height:72px;border-radius:var(--radius)"></div>
      <div class="skeleton" style="height:72px;border-radius:var(--radius)"></div>
      <div class="skeleton" style="height:72px;border-radius:var(--radius)"></div>
      <div class="skeleton" style="height:72px;border-radius:var(--radius)"></div>
    </div>
  </div>
</section>

<footer class="footer" id="footer"></footer>

<script>
const SITE={baseUrl:"https://www.timeandtime.online",dataUrl:{studio:"https://raw.githubusercontent.com/TimeAndTimeStudio/Battle-Mushroom/main/data/studio.json",games:"https://raw.githubusercontent.com/TimeAndTimeStudio/Battle-Mushroom/main/data/games.json"},nav:[{label:"หน้าแรก",href:"index.html"},{label:"เกม",href:"games.html"},{label:"Devlog",href:"devlog.html"},{label:"เกี่ยวกับ",href:"about.html"}]};
const ICONS={github:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/></svg>`,youtube:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M22.54 6.42a2.78 2.78 0 0 0-1.95-1.96C18.88 4 12 4 12 4s-6.88 0-8.59.46a2.78 2.78 0 0 0-1.95 1.96A29 29 0 0 0 1 12a29 29 0 0 0 .46 5.58A2.78 2.78 0 0 0 3.41 19.6C5.12 20 12 20 12 20s6.88 0 8.59-.46a2.78 2.78 0 0 0 1.95-1.95A29 29 0 0 0 23 12a29 29 0 0 0-.46-5.58z"/><polygon points="9.75 15.02 15.5 12 9.75 8.98 9.75 15.02"/></svg>`,itch:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10c4-2 5 2 9 0s5-2 9 0"/></svg>`,globe:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>`,externalLink:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>`,layers:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>`};

async function fetchJSON(url){try{const r=await fetch(url);if(!r.ok)throw new Error(r.status);return await r.json()}catch(e){console.error('[TAT]',url,e);return null}}
function renderNav(studio){const current=location.pathname.split('/').pop()||'index.html';const logoText=studio?studio.shortName.replace('TAT','<span>TAT</span>'):'<span>TAT</span> Studio';document.getElementById('nav-logo').innerHTML=logoText;const ul=document.getElementById('nav-links');ul.innerHTML=SITE.nav.map(n=>`<li><a href="${n.href}" class="${n.href===current?'active':''}">${n.label}</a></li>`).join('')}
function renderFooter(studio){const s=studio||{shortName:'TAT Studio',links:{}};document.getElementById('footer').innerHTML=`<p>&copy; ${new Date().getFullYear()} ${s.shortName}. All rights reserved.</p><p style="margin-top:8px"><a href="${s.links?.github||'#'}">GitHub</a> &nbsp;·&nbsp; <a href="${s.links?.youtube||'#'}">YouTube</a> &nbsp;·&nbsp; <a href="${s.links?.itch||'#'}">Itch.io</a></p>`}
function initFade(){const obs=new IntersectionObserver(entries=>entries.forEach(e=>e.isIntersecting&&e.target.classList.add('visible')),{threshold:.1});document.querySelectorAll('.fade').forEach(el=>obs.observe(el))}

function linkCard(icon, name, url, label) {
  return `<a href="${url||'#'}" class="link-card" target="_blank" rel="noopener">
    <div class="link-card-icon">${ICONS[icon]||''}</div>
    <div class="link-card-text"><div class="link-card-name">${name}</div><div class="link-card-url">${label||url||''}</div></div>
    <div class="link-card-arrow">${ICONS.externalLink}</div>
  </a>`;
}

async function init(){
  const[studio,games]=await Promise.all([fetchJSON(SITE.dataUrl.studio),fetchJSON(SITE.dataUrl.games)]);
  renderNav(studio);
  renderFooter(studio);

  if(studio){
    document.getElementById('studio-info').innerHTML=`
      <div class="fade">
        <div class="studio-logo-box">
          ${studio.logo?`<img src="${studio.logo}" alt="${studio.name}">`:`${ICONS.layers}`}
        </div>
        <h1 style="font-size:2rem;margin-bottom:6px">${studio.name}</h1>
        <p style="color:var(--text-sec);font-size:1rem;margin-bottom:20px">${studio.tagline}</p>
        <p style="color:var(--text-sec);line-height:1.75;max-width:640px">${studio.about}</p>
      </div>`;
  }

  if(games&&studio){
    // Unique platforms
    const platforms=new Set();
    games.forEach(g=>(g.info?.platform||'').split(',').forEach(p=>platforms.add(p.trim())));
    // Earliest release year
    let minYear='—';
    games.forEach(g=>{const d=g.info?.releaseDate;if(d){const y=d.split(' ').pop();if(!minYear||y<minYear)minYear=y}});

    document.getElementById('stats-grid').innerHTML=`
      <div class="stat-card"><div class="stat-number">${games.length}</div><div class="stat-label">เกม</div></div>
      <div class="stat-card"><div class="stat-number">${platforms.size}</div><div class="stat-label">Platform</div></div>
      <div class="stat-card"><div class="stat-number">${minYear}</div><div class="stat-label">ปีเริ่มต้น</div></div>`;

    document.getElementById('links-grid').innerHTML=`
      ${linkCard('github','GitHub',studio.links?.github,'github.com/TimeAndTimeStudio')}
      ${linkCard('youtube','YouTube',studio.links?.youtube,'@TAT_Game_Real')}
      ${linkCard('itch','Itch.io',studio.links?.itch,'timeandtimestudio.itch.io')}
      ${linkCard('globe','เว็บไซต์',studio.website,studio.website?.replace('https://',''))}`;
  }
  initFade();
}
init();
</script>
</body>
</html>
