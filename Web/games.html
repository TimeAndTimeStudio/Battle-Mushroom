<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#FF6B00">
  <meta name="description" content="รวมเกมทั้งหมดจาก TAT Studio — ดาวน์โหลดได้ฟรีทุกเกม รองรับ Android และ Desktop">
  <meta property="og:image" content="https://img.tapimg.net/market/images/37f3779125fc38cf177bab91cd44da60.png">
  <link rel="canonical" href="https://www.timeandtime.online/games.html">
  <title>เกมทั้งหมด — TAT Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#0D0D0D;--bg-card:#111111;--bg-subtle:#161616;--bg-hover:#1a1a1a;--border:#242424;--border-mid:#303030;--border-hover:#FF6B00;--accent:#FF6B00;--accent-dim:rgba(255,107,0,.10);--accent-muted:rgba(255,107,0,.06);--status-demo:#FF6B00;--status-release:#22C55E;--status-soon:#6B7280;--text:#E2E2E2;--text-sec:#A0A0A0;--text-muted:#6B6B6B;--text-dim:#404040;--radius:10px;--radius-sm:6px;--radius-xs:4px;--max-w:1080px;--nav-h:60px;--section-gap:80px;--card-pad:24px}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{font-size:16px;-webkit-font-smoothing:antialiased}
    body{background:var(--bg);color:var(--text);font-family:"Inter",system-ui,sans-serif;font-size:.9375rem;line-height:1.6}
    h1,h2,h3{font-family:"Space Grotesk",sans-serif;font-weight:600;letter-spacing:-.02em;line-height:1.25}
    a{color:inherit;text-decoration:none}
    img{display:block;max-width:100%}
    svg{flex-shrink:0}
    .navbar{position:sticky;top:0;z-index:100;height:var(--nav-h);display:flex;align-items:center;padding:0 24px;background:rgba(13,13,13,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
    .navbar-inner{width:100%;max-width:var(--max-w);margin:0 auto;display:flex;align-items:center;gap:32px}
    .nav-logo{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:1rem;letter-spacing:-.01em;color:var(--text)}
    .nav-logo span{color:var(--accent)}
    .nav-links{display:flex;gap:4px;margin-left:auto;list-style:none}
    .nav-links a{display:flex;align-items:center;gap:6px;padding:6px 14px;border-radius:var(--radius-sm);font-size:.875rem;font-weight:500;color:var(--text-sec);transition:color .15s,background .15s}
    .nav-links a:hover,.nav-links a.active{color:var(--text);background:var(--bg-subtle)}
    .nav-links a.active{color:var(--accent)}
    .btn{display:inline-flex;align-items:center;gap:8px;padding:9px 18px;border-radius:var(--radius-sm);font-family:"Inter",sans-serif;font-size:.875rem;font-weight:500;cursor:pointer;transition:opacity .15s,background .15s,border-color .15s;white-space:nowrap;border:1px solid transparent}
    .btn svg{width:1rem;height:1rem}
    .btn-primary{background:var(--accent);color:#000;border-color:var(--accent)}
    .btn-primary:hover{opacity:.88}
    .btn-secondary{background:var(--bg-subtle);color:var(--text);border-color:var(--border-mid)}
    .btn-secondary:hover{background:var(--bg-hover);border-color:var(--border-hover)}
    .badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:var(--radius-xs);font-size:.72rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;border:1px solid transparent}
    .badge-demo{color:var(--status-demo);background:rgba(255,107,0,.10);border-color:rgba(255,107,0,.20)}
    .badge-release{color:var(--status-release);background:rgba(34,197,94,.10);border-color:rgba(34,197,94,.20)}
    .badge-soon{color:var(--status-soon);background:rgba(107,114,128,.12);border-color:rgba(107,114,128,.20)}
    .tag{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;font-size:.78rem;font-weight:500;color:var(--text-sec);background:var(--bg-subtle);border:1px solid var(--border)}
    .section{padding:var(--section-gap) 24px}
    .section-inner{max-width:var(--max-w);margin:0 auto}
    .section-header{margin-bottom:32px}
    .grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
    @media(max-width:900px){.grid-3{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:600px){.grid-3{grid-template-columns:1fr}}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
    .skeleton{background:var(--bg-subtle);border-radius:var(--radius-sm);animation:pulse 1.6s ease-in-out infinite}
    .fade{opacity:0;transform:translateY(16px);transition:opacity .4s ease,transform .4s ease}
    .fade.visible{opacity:1;transform:none}
    .footer{padding:40px 24px;border-top:1px solid var(--border);text-align:center;color:var(--text-muted);font-size:.8125rem}
    .footer a{color:var(--text-sec)}
    .footer a:hover{color:var(--accent)}
    .filter-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:32px}
    .filter-btn{display:inline-flex;align-items:center;gap:6px;padding:6px 16px;border-radius:999px;font-size:.8125rem;font-weight:500;color:var(--text-sec);background:transparent;border:1px solid var(--border-mid);cursor:pointer;transition:color .15s,background .15s,border-color .15s}
    .filter-btn:hover{color:var(--text);border-color:var(--border-hover)}
    .filter-btn.active{color:var(--accent);background:var(--accent-dim);border-color:var(--accent)}
    .thumb{width:100%;aspect-ratio:16/9;background:var(--bg-subtle);border-radius:var(--radius-sm);border:1px solid var(--border);overflow:hidden}
    .thumb img{width:100%;height:100%;object-fit:cover}
    .thumb-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--text-dim)}
    .thumb-placeholder svg{width:2rem;height:2rem}
    .game-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;transition:border-color .2s,box-shadow .2s}
    .game-card:hover{border-color:var(--border-mid);box-shadow:0 4px 20px rgba(0,0,0,.4)}
    .game-card-body{padding:var(--card-pad);flex:1;display:flex;flex-direction:column}
    .game-card-meta{display:flex;align-items:center;gap:8px;margin-bottom:10px}
    .game-card-title{font-size:1.0625rem;font-weight:600;color:var(--text);margin-bottom:6px}
    .game-card-desc{color:var(--text-sec);font-size:.875rem;line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:12px;flex:1}
    .game-card-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
    .game-card-actions{display:flex;gap:8px;flex-wrap:wrap}
    .page-hero{padding:60px 24px 0;background:var(--bg-subtle);border-bottom:1px solid var(--border)}
    .page-hero-inner{max-width:var(--max-w);margin:0 auto;padding-bottom:32px}
    .page-hero h1{font-size:2rem;margin-bottom:6px}
    .page-hero p{color:var(--text-sec)}
    .counter{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;background:var(--accent-dim);border:1px solid rgba(255,107,0,.25);border-radius:var(--radius-xs);font-size:.75rem;font-weight:700;color:var(--accent);margin-left:8px;vertical-align:middle}
  </style>
</head>
<body>
<nav class="navbar">
  <div class="navbar-inner">
    <a href="index.html" class="nav-logo" id="nav-logo"><span>TAT</span> Studio</a>
    <ul class="nav-links" id="nav-links"></ul>
  </div>
</nav>

<div class="page-hero">
  <div class="page-hero-inner">
    <h1>เกมทั้งหมด <span class="counter" id="game-counter">—</span></h1>
    <p>ผลงานทุกชิ้นจาก TAT Studio — ดาวน์โหลดฟรีทุกเกม</p>
  </div>
</div>

<section class="section">
  <div class="section-inner">
    <div class="filter-bar" id="filter-bar">
      <button class="filter-btn active" data-filter="all">ทั้งหมด</button>
      <button class="filter-btn" data-filter="demo">Demo</button>
      <button class="filter-btn" data-filter="released">Released</button>
      <button class="filter-btn" data-filter="coming-soon">Coming Soon</button>
    </div>
    <div class="grid-3" id="games-grid">
      <div class="skeleton" style="height:340px;border-radius:var(--radius)"></div>
      <div class="skeleton" style="height:340px;border-radius:var(--radius)"></div>
      <div class="skeleton" style="height:340px;border-radius:var(--radius)"></div>
    </div>
    <div id="empty-msg" style="display:none;text-align:center;padding:60px;color:var(--text-muted)">ไม่พบเกมในหมวดนี้</div>
  </div>
</section>

<footer class="footer" id="footer"></footer>

<script>
const SITE={baseUrl:"https://www.timeandtime.online",dataUrl:{studio:"https://raw.githubusercontent.com/TimeAndTimeStudio/Battle-Mushroom/main/data/studio.json",games:"https://raw.githubusercontent.com/TimeAndTimeStudio/Battle-Mushroom/main/data/games.json"},nav:[{label:"หน้าแรก",href:"index.html"},{label:"เกม",href:"games.html"},{label:"Devlog",href:"devlog.html"},{label:"เกี่ยวกับ",href:"about.html"}]};
const ICONS={download:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>`,arrowRight:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>`,image:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>`};

async function fetchJSON(url){try{const r=await fetch(url);if(!r.ok)throw new Error(r.status);return await r.json()}catch(e){console.error('[TAT]',url,e);return null}}
function renderNav(studio){const current=location.pathname.split('/').pop()||'index.html';const logoText=studio?studio.shortName.replace('TAT','<span>TAT</span>'):'<span>TAT</span> Studio';document.getElementById('nav-logo').innerHTML=logoText;const ul=document.getElementById('nav-links');ul.innerHTML=SITE.nav.map(n=>`<li><a href="${n.href}" class="${n.href===current?'active':''}">${n.label}</a></li>`).join('')}
function renderFooter(studio){const s=studio||{shortName:'TAT Studio',links:{}};document.getElementById('footer').innerHTML=`<p>&copy; ${new Date().getFullYear()} ${s.shortName}. All rights reserved.</p><p style="margin-top:8px"><a href="${s.links?.github||'#'}">GitHub</a> &nbsp;·&nbsp; <a href="${s.links?.youtube||'#'}">YouTube</a> &nbsp;·&nbsp; <a href="${s.links?.itch||'#'}">Itch.io</a></p>`}
function badgeHtml(status){const map={demo:['badge-demo','Demo'],released:['badge-release','Released'],'coming-soon':['badge-soon','Coming Soon']};const[cls,label]=map[status]||map['coming-soon'];return`<span class="badge ${cls}">${label}</span>`}
function initFade(){const obs=new IntersectionObserver(entries=>entries.forEach(e=>e.isIntersecting&&e.target.classList.add('visible')),{threshold:.1});document.querySelectorAll('.fade').forEach(el=>obs.observe(el))}
function thumbHtml(img){return img?`<img src="${img}" alt="" loading="lazy">`:`<div class="thumb-placeholder">${ICONS.image}</div>`}

function renderGameCard(g){
  const dlUrl=g.downloads?.[0]?.url||'#';
  return `<div class="game-card fade" data-status="${g.status}">
    <div class="thumb">${thumbHtml(g.images?.banner)}</div>
    <div class="game-card-body">
      <div class="game-card-meta">${badgeHtml(g.status)}</div>
      <h3 class="game-card-title">${g.title}</h3>
      <p class="game-card-desc">${g.description?.th||''}</p>
      <div class="game-card-tags">${(g.tags||[]).map(t=>`<span class="tag">${t}</span>`).join('')}</div>
      <div class="game-card-actions">
        <a href="${dlUrl}" class="btn btn-primary" target="_blank" rel="noopener">${ICONS.download} ดาวน์โหลด</a>
        <a href="game.html?id=${g.id}" class="btn btn-secondary">${ICONS.arrowRight} รายละเอียด</a>
      </div>
    </div>
  </div>`;
}

function initFilter(){
  document.querySelectorAll('.filter-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      const val=btn.dataset.filter;
      let shown=0;
      document.querySelectorAll('.game-card').forEach(el=>{
        const show=val==='all'||el.dataset.status===val;
        el.style.display=show?'':'none';
        if(show)shown++;
      });
      document.getElementById('empty-msg').style.display=shown?'none':'block';
    });
  });
}

async function init(){
  const[studio,games]=await Promise.all([fetchJSON(SITE.dataUrl.studio),fetchJSON(SITE.dataUrl.games)]);
  renderNav(studio);
  renderFooter(studio);
  if(games){
    document.getElementById('game-counter').textContent=games.length;
    document.getElementById('games-grid').innerHTML=games.map(renderGameCard).join('');
    initFilter();
    initFade();
  } else {
    document.getElementById('games-grid').innerHTML=`<div style="grid-column:1/-1;text-align:center;padding:60px;color:var(--text-muted)">ไม่สามารถโหลดข้อมูลได้</div>`;
  }
}
init();
</script>
</body>
</html>
