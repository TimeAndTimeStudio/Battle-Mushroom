<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Devlog — TAT Studio">
  <meta name="theme-color" content="#0D0D0D">
  <title>Devlog — TAT Studio</title>

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%23FF6B00'/><text x='50' y='60' font-size='60' font-weight='bold' fill='%23000'>T</text></svg>">
  <link rel="canonical" href="https://www.timeandtime.online/devlog.html">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap');

    :root {
      --bg: #0D0D0D;
      --bg-card: #111111;
      --bg-subtle: #161616;
      --bg-hover: #1a1a1a;
      --border: #242424;
      --border-mid: #303030;
      --border-hover: #FF6B00;
      --accent: #FF6B00;
      --accent-dim: rgba(255, 107, 0, 0.10);
      --status-release: #22C55E;
      --status-soon: #6B7280;
      --text: #E2E2E2;
      --text-sec: #A0A0A0;
      --text-muted: #6B6B6B;
      --text-dim: #404040;
      --radius: 10px;
      --radius-sm: 6px;
      --radius-xs: 4px;
      --max-w: 1080px;
      --nav-h: 60px;
      --section-gap: 80px;
      --card-pad: 24px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; -webkit-font-smoothing: antialiased; }
    body { background: var(--bg); color: var(--text); font-family: "Inter", system-ui, sans-serif; font-size: 0.9375rem; line-height: 1.6; }
    h1, h2, h3 { font-family: "Space Grotesk", sans-serif; font-weight: 600; letter-spacing: -0.02em; line-height: 1.25; }
    h4, h5, h6, label, .label { font-family: "Inter", sans-serif; font-weight: 500; }
    a { color: inherit; text-decoration: none; }
    svg { flex-shrink: 0; }

    .icon { display: inline-flex; align-items: center; justify-content: center; width: 1em; height: 1em; vertical-align: middle; }
    .icon svg { width: 100%; height: 100%; }

    .navbar {
      position: sticky;
      top: 0;
      z-index: 100;
      height: var(--nav-h);
      display: flex;
      align-items: center;
      padding: 0 24px;
      background: rgba(13, 13, 13, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }
    .navbar-inner { width: 100%; max-width: var(--max-w); margin: 0 auto; display: flex; align-items: center; gap: 32px; }
    .nav-logo { font-family: "Space Grotesk", sans-serif; font-weight: 700; font-size: 1rem; color: var(--text); }
    .nav-logo span { color: var(--accent); }
    .nav-links { display: flex; gap: 4px; margin-left: auto; list-style: none; }
    .nav-links a {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: var(--radius-sm);
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text-sec);
      transition: color 0.15s, background 0.15s;
    }
    .nav-links a:hover, .nav-links a.active { color: var(--text); background: var(--bg-subtle); }
    .nav-links a.active { color: var(--accent); }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 9px;
      border-radius: var(--radius-xs);
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      border: 1px solid transparent;
    }
    .badge-release { color: var(--status-release); background: rgba(34,197,94,0.10); border-color: rgba(34,197,94,0.20); }
    .badge-latest { color: var(--accent); background: var(--accent-dim); border-color: rgba(255,107,0,0.25); }

    .section {
      padding: var(--section-gap) 24px;
    }
    .section-inner {
      max-width: var(--max-w);
      margin: 0 auto;
    }
    .section-header {
      margin-bottom: 40px;
    }
    .section-header h2 {
      font-size: 1.75rem;
      color: var(--text);
    }

    .filter-bar {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 32px;
    }
    .filter-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 16px;
      border-radius: 999px;
      font-size: 0.8125rem;
      font-weight: 500;
      color: var(--text-sec);
      background: transparent;
      border: 1px solid var(--border-mid);
      cursor: pointer;
      transition: color 0.15s, background 0.15s, border-color 0.15s;
    }
    .filter-btn:hover { color: var(--text); border-color: var(--border-hover); }
    .filter-btn.active { color: var(--accent); background: var(--accent-dim); border-color: var(--accent); }

    .timeline {
      display: flex;
      flex-direction: column;
      gap: 0;
      position: relative;
      padding-left: 28px;
    }
    .timeline::before {
      content: '';
      position: absolute;
      left: 7px;
      top: 6px;
      bottom: 6px;
      width: 1px;
      background: var(--border);
    }
    .timeline-item {
      position: relative;
      padding: 0 0 24px 24px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .timeline-dot {
      position: absolute;
      left: 0;
      top: 5px;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: var(--bg-card);
      border: 2px solid var(--border-mid);
      z-index: 1;
    }
    .timeline-dot.has-release { border-color: var(--accent); background: var(--accent); }
    .game-label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 10px;
      border-radius: var(--radius-xs);
      font-size: 0.75rem;
      font-weight: 600;
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      color: var(--text-sec);
      width: fit-content;
    }
    .timeline-day { font-weight: 600; font-size: 0.9375rem; color: var(--text); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .timeline-note { font-size: 0.875rem; color: var(--text-sec); }
    .timeline-date { font-size: 0.8rem; color: var(--text-muted); }

    .footer {
      padding: 40px 24px;
      border-top: 1px solid var(--border);
      text-align: center;
      color: var(--text-muted);
      font-size: 0.8125rem;
    }
  </style>
</head>
<body>
  <script>
    const SITE = {
      baseUrl: "https://www.timeandtime.online",
      dataUrl: {
        studio: "https://raw.githubusercontent.com/TimeAndTimeStudio/Battle-Mushroom/main/data/studio.json",
        games:  "https://raw.githubusercontent.com/TimeAndTimeStudio/Battle-Mushroom/main/data/games.json",
      },
      nav: [
        { label: "หน้าแรก",  href: "index.html"  },
        { label: "เกม",      href: "games.html"  },
        { label: "Devlog",   href: "devlog.html" },
        { label: "เกี่ยวกับ", href: "about.html" },
      ]
    };

    const ICONS = {
      calendar: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>`,
      gamepad: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="4"/><circle cx="18" cy="18" r="4"/><path d="M10 8l4 4M14 16l-4-4"/></svg>`,
    };

    async function fetchJSON(url) {
      try {
        const r = await fetch(url);
        if (!r.ok) throw new Error(r.status);
        return await r.json();
      } catch (e) {
        console.error('[TAT]', url, e);
        return null;
      }
    }

    function renderNav(studio) {
      const current = location.pathname.split('/').pop() || 'index.html';
      const logo = document.getElementById('nav-logo');
      logo.innerHTML = studio ? `${studio.shortName.split(' ')[0]}<span>.</span>` : 'TAT<span>.</span>';

      const ul = document.getElementById('nav-links');
      ul.innerHTML = SITE.nav.map(n => `<li><a href="${n.href}" class="${current === n.href ? 'active' : ''}">${n.label}</a></li>`).join('');
    }

    function renderFooter(studio) {
      const s = studio || { shortName: 'TAT Studio' };
      document.getElementById('footer').innerHTML = `&copy; ${new Date().getFullYear()} ${s.shortName}. All rights reserved.`;
    }

    function renderDevlog(games) {
      const allEntries = [];
      games.forEach(game => {
        game.devlog?.forEach(entry => {
          allEntries.push({ ...entry, gameId: game.id, gameTitle: game.title });
        });
      });

      allEntries.sort((a, b) => {
        const dateA = a.date ? new Date(a.date) : new Date(0);
        const dateB = b.date ? new Date(b.date) : new Date(0);
        return dateB - dateA;
      });

      const filterBar = document.getElementById('filter-bar');
      filterBar.innerHTML = '<button class="filter-btn active" data-game="all">ทั้งหมด</button>' +
        games.map(g => `<button class="filter-btn" data-game="${g.id}">${g.title}</button>`).join('');

      const timeline = document.getElementById('timeline');
      timeline.innerHTML = '<div class="timeline">' + allEntries.map(e => `
        <div class="timeline-item" data-game="${e.gameId}">
          <div class="timeline-dot ${e.version ? 'has-release' : ''}"></div>
          <div class="game-label">
            <span class="icon">${ICONS.gamepad}</span> ${e.gameTitle}
          </div>
          <div class="timeline-day">
            Day ${e.day}
            ${e.version ? `<span class="badge badge-release">${e.version}</span>` : ''}
            ${e.isLatest ? '<span class="badge badge-latest">LATEST</span>' : ''}
          </div>
          <p class="timeline-note">${e.note}</p>
          ${e.date ? `<p class="timeline-date"><span class="icon">${ICONS.calendar}</span> ${e.date}</p>` : ''}
        </div>
      `).join('') + '</div>';

      initFilter(allEntries);
    }

    function initFilter(entries) {
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          const gameId = btn.dataset.game;
          document.querySelectorAll('[data-game]').forEach(el => {
            el.style.display = (gameId === 'all' || el.dataset.game === gameId) ? '' : 'none';
          });
        });
      });
    }

    async function init() {
      const studio = await fetchJSON(SITE.dataUrl.studio);
      const games = await fetchJSON(SITE.dataUrl.games);

      if (studio) renderNav(studio);
      if (studio) renderFooter(studio);

      if (games && games.length > 0) {
        renderDevlog(games);
        document.querySelector('.filter-btn').click();
      }
    }

    init();
  </script>

  <nav class="navbar">
    <div class="navbar-inner">
      <div class="nav-logo" id="nav-logo">TAT<span>.</span></div>
      <ul class="nav-links" id="nav-links"></ul>
    </div>
  </nav>

  <section class="section">
    <div class="section-inner">
      <div class="section-header">
        <h2>บันทึกการพัฒนา</h2>
      </div>

      <div class="filter-bar" id="filter-bar"></div>

      <div id="timeline"></div>
    </div>
  </section>

  <footer class="footer" id="footer"></footer>
</body>
</html>
