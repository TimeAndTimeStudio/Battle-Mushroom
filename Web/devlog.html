<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#FF6B00">
  <meta name="description" content="บันทึกการพัฒนาเกมจาก TAT Studio — ติดตามความคืบหน้าทุกวัน">
  <meta property="og:image" content="https://img.tapimg.net/market/images/37f3779125fc38cf177bab91cd44da60.png">
  <link rel="canonical" href="https://www.timeandtime.online/devlog.html">
  <title>Devlog — TAT Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#0D0D0D;--bg-card:#111111;--bg-subtle:#161616;--bg-hover:#1a1a1a;--border:#242424;--border-mid:#303030;--border-hover:#FF6B00;--accent:#FF6B00;--accent-dim:rgba(255,107,0,.10);--accent-muted:rgba(255,107,0,.06);--status-demo:#FF6B00;--status-release:#22C55E;--status-soon:#6B7280;--text:#E2E2E2;--text-sec:#A0A0A0;--text-muted:#6B6B6B;--text-dim:#404040;--radius:10px;--radius-sm:6px;--radius-xs:4px;--max-w:1080px;--nav-h:60px;--section-gap:80px;--card-pad:24px}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{font-size:16px;-webkit-font-smoothing:antialiased}
    body{background:var(--bg);color:var(--text);font-family:"Inter",system-ui,sans-serif;font-size:.9375rem;line-height:1.6}
    h1,h2,h3{font-family:"Space Grotesk",sans-serif;font-weight:600;letter-spacing:-.02em;line-height:1.25}
    a{color:inherit;text-decoration:none}
    svg{flex-shrink:0}
    .navbar{position:sticky;top:0;z-index:100;height:var(--nav-h);display:flex;align-items:center;padding:0 24px;background:rgba(13,13,13,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
    .navbar-inner{width:100%;max-width:var(--max-w);margin:0 auto;display:flex;align-items:center;gap:32px}
    .nav-logo{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:1rem;letter-spacing:-.01em;color:var(--text)}
    .nav-logo span{color:var(--accent)}
    .nav-links{display:flex;gap:4px;margin-left:auto;list-style:none}
    .nav-links a{display:flex;align-items:center;gap:6px;padding:6px 14px;border-radius:var(--radius-sm);font-size:.875rem;font-weight:500;color:var(--text-sec);transition:color .15s,background .15s}
    .nav-links a:hover,.nav-links a.active{color:var(--text);background:var(--bg-subtle)}
    .nav-links a.active{color:var(--accent)}
    .badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:var(--radius-xs);font-size:.72rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;border:1px solid transparent}
    .badge-demo{color:var(--status-demo);background:rgba(255,107,0,.10);border-color:rgba(255,107,0,.20)}
    .badge-latest{color:var(--accent);background:var(--accent-dim);border-color:rgba(255,107,0,.25)}
    .filter-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:40px}
    .filter-btn{display:inline-flex;align-items:center;gap:6px;padding:6px 16px;border-radius:999px;font-size:.8125rem;font-weight:500;color:var(--text-sec);background:transparent;border:1px solid var(--border-mid);cursor:pointer;transition:color .15s,background .15s,border-color .15s}
    .filter-btn:hover{color:var(--text);border-color:var(--border-hover)}
    .filter-btn.active{color:var(--accent);background:var(--accent-dim);border-color:var(--accent)}
    .section{padding:var(--section-gap) 24px}
    .section-inner{max-width:var(--max-w);margin:0 auto}
    .footer{padding:40px 24px;border-top:1px solid var(--border);text-align:center;color:var(--text-muted);font-size:.8125rem}
    .footer a{color:var(--text-sec)}
    .footer a:hover{color:var(--accent)}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
    .skeleton{background:var(--bg-subtle);border-radius:var(--radius-sm);animation:pulse 1.6s ease-in-out infinite}
    .page-hero{padding:60px 24px 32px;background:var(--bg-subtle);border-bottom:1px solid var(--border)}
    .page-hero-inner{max-width:var(--max-w);margin:0 auto}
    .page-hero h1{font-size:2rem;margin-bottom:6px}
    .page-hero p{color:var(--text-sec)}

    /* Timeline */
    .timeline{display:flex;flex-direction:column;position:relative;padding-left:28px}
    .timeline::before{content:'';position:absolute;left:7px;top:6px;bottom:6px;width:1px;background:var(--border)}
    .timeline-item{position:relative;padding:0 0 32px 24px}
    .timeline-item[data-hidden="true"]{display:none}
    .timeline-dot{position:absolute;left:0;top:5px;width:15px;height:15px;border-radius:50%;background:var(--bg-card);border:2px solid var(--border-mid);z-index:1}
    .timeline-dot.has-release{border-color:var(--accent);background:var(--accent)}
    .timeline-item-header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
    .timeline-day{font-weight:600;font-size:.9375rem;color:var(--text)}
    .timeline-note{font-size:.875rem;color:var(--text-sec);margin-bottom:6px}
    .timeline-date{font-size:.8rem;color:var(--text-muted);display:flex;align-items:center;gap:4px}
    .timeline-date svg{width:.8rem;height:.8rem}
    .game-label{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:var(--radius-xs);font-size:.75rem;font-weight:600;background:var(--bg-subtle);border:1px solid var(--border);color:var(--text-sec);margin-bottom:6px}
    .game-label svg{width:.875rem;height:.875rem}
  </style>
</head>
<body>
<nav class="navbar">
  <div class="navbar-inner">
    <a href="index.html" class="nav-logo" id="nav-logo"><span>TAT</span> Studio</a>
    <ul class="nav-links" id="nav-links"></ul>
  </div>
</nav>

<div class="page-hero">
  <div class="page-hero-inner">
    <h1>บันทึกการพัฒนา</h1>
    <p>ความคืบหน้าทุกวันจาก TAT Studio</p>
  </div>
</div>

<section class="section">
  <div class="section-inner">
    <div class="filter-bar" id="filter-bar">
      <button class="filter-btn active" data-filter="all">ทั้งหมด</button>
    </div>
    <div class="timeline" id="timeline">
      <div class="skeleton" style="height:80px;margin-bottom:24px;border-radius:var(--radius-sm)"></div>
      <div class="skeleton" style="height:80px;margin-bottom:24px;border-radius:var(--radius-sm)"></div>
      <div class="skeleton" style="height:80px;margin-bottom:24px;border-radius:var(--radius-sm)"></div>
    </div>
  </div>
</section>

<footer class="footer" id="footer"></footer>

<script>
const SITE={baseUrl:"https://www.timeandtime.online",dataUrl:{studio:"https://raw.githubusercontent.com/TimeAndTimeStudio/Battle-Mushroom/main/data/studio.json",games:"https://raw.githubusercontent.com/TimeAndTimeStudio/Battle-Mushroom/main/data/games.json"},nav:[{label:"หน้าแรก",href:"index.html"},{label:"เกม",href:"games.html"},{label:"Devlog",href:"devlog.html"},{label:"เกี่ยวกับ",href:"about.html"}]};
const ICONS={calendar:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>`,gamepad:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="12" x2="10" y2="12"/><line x1="8" y1="10" x2="8" y2="14"/><line x1="15" y1="13" x2="15.01" y2="13"/><line x1="18" y1="11" x2="18.01" y2="11"/><rect x="2" y="8" width="20" height="8" rx="4"/></svg>`};

async function fetchJSON(url){try{const r=await fetch(url);if(!r.ok)throw new Error(r.status);return await r.json()}catch(e){console.error('[TAT]',url,e);return null}}
function renderNav(studio){const current=location.pathname.split('/').pop()||'index.html';const logoText=studio?studio.shortName.replace('TAT','<span>TAT</span>'):'<span>TAT</span> Studio';document.getElementById('nav-logo').innerHTML=logoText;const ul=document.getElementById('nav-links');ul.innerHTML=SITE.nav.map(n=>`<li><a href="${n.href}" class="${n.href===current?'active':''}">${n.label}</a></li>`).join('')}
function renderFooter(studio){const s=studio||{shortName:'TAT Studio',links:{}};document.getElementById('footer').innerHTML=`<p>&copy; ${new Date().getFullYear()} ${s.shortName}. All rights reserved.</p><p style="margin-top:8px"><a href="${s.links?.github||'#'}">GitHub</a> &nbsp;·&nbsp; <a href="${s.links?.youtube||'#'}">YouTube</a> &nbsp;·&nbsp; <a href="${s.links?.itch||'#'}">Itch.io</a></p>`}

async function init(){
  const[studio,games]=await Promise.all([fetchJSON(SITE.dataUrl.studio),fetchJSON(SITE.dataUrl.games)]);
  renderNav(studio);
  renderFooter(studio);

  if(!games){document.getElementById('timeline').innerHTML=`<p style="color:var(--text-muted)">ไม่สามารถโหลดข้อมูลได้</p>`;return;}

  // Build unified devlog
  const entries=[];
  games.forEach(game=>{
    (game.devlog||[]).forEach(e=>{
      entries.push({...e, gameId:game.id, gameTitle:game.title});
    });
  });
  entries.sort((a,b)=>b.day-a.day);

  // Filter bar
  const filterBar=document.getElementById('filter-bar');
  games.forEach(g=>{
    const btn=document.createElement('button');
    btn.className='filter-btn';
    btn.dataset.filter=g.id;
    btn.textContent=g.title;
    filterBar.appendChild(btn);
  });

  // Render timeline
  document.getElementById('timeline').innerHTML=entries.map(e=>`
    <div class="timeline-item" data-game="${e.gameId}">
      <div class="timeline-dot ${e.version?'has-release':''}"></div>
      <div class="game-label">${ICONS.gamepad} ${e.gameTitle}</div>
      <div class="timeline-item-header">
        <span class="timeline-day">Day ${e.day}</span>
        ${e.version?`<span class="badge badge-demo" style="font-size:.7rem">${e.version}</span>`:''}
        ${e.isLatest?`<span class="badge badge-latest">ล่าสุด</span>`:''}
      </div>
      <p class="timeline-note">${e.note}</p>
      ${e.date?`<div class="timeline-date">${ICONS.calendar} ${e.date}</div>`:''}
    </div>`).join('');

  // Init filter
  document.querySelectorAll('.filter-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      const val=btn.dataset.filter;
      document.querySelectorAll('.timeline-item').forEach(el=>{
        el.style.display=(val==='all'||el.dataset.game===val)?'':'none';
      });
    });
  });

  // Highlight if ?id= param
  const focusId=new URLSearchParams(location.search).get('id');
  if(focusId){
    const btn=document.querySelector(`.filter-btn[data-filter="${focusId}"]`);
    if(btn)btn.click();
  }
}
init();
</script>
</body>
</html>
