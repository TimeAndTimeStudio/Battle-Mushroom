<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#FF6B00">
  <meta name="description" content="">
  <meta property="og:image" content="https://img.tapimg.net/market/images/37f3779125fc38cf177bab91cd44da60.png">
  <title>เกม — TAT Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#0D0D0D;--bg-card:#111111;--bg-subtle:#161616;--bg-hover:#1a1a1a;--border:#242424;--border-mid:#303030;--border-hover:#FF6B00;--accent:#FF6B00;--accent-dim:rgba(255,107,0,.10);--accent-muted:rgba(255,107,0,.06);--status-demo:#FF6B00;--status-release:#22C55E;--status-soon:#6B7280;--text:#E2E2E2;--text-sec:#A0A0A0;--text-muted:#6B6B6B;--text-dim:#404040;--radius:10px;--radius-sm:6px;--radius-xs:4px;--max-w:1080px;--nav-h:60px;--section-gap:80px;--card-pad:24px}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{font-size:16px;-webkit-font-smoothing:antialiased}
    body{background:var(--bg);color:var(--text);font-family:"Inter",system-ui,sans-serif;font-size:.9375rem;line-height:1.6}
    h1,h2,h3{font-family:"Space Grotesk",sans-serif;font-weight:600;letter-spacing:-.02em;line-height:1.25}
    a{color:inherit;text-decoration:none}
    img{display:block;max-width:100%}
    svg{flex-shrink:0}
    .navbar{position:sticky;top:0;z-index:100;height:var(--nav-h);display:flex;align-items:center;padding:0 24px;background:rgba(13,13,13,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
    .navbar-inner{width:100%;max-width:var(--max-w);margin:0 auto;display:flex;align-items:center;gap:32px}
    .nav-logo{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:1rem;letter-spacing:-.01em;color:var(--text)}
    .nav-logo span{color:var(--accent)}
    .nav-links{display:flex;gap:4px;margin-left:auto;list-style:none}
    .nav-links a{display:flex;align-items:center;gap:6px;padding:6px 14px;border-radius:var(--radius-sm);font-size:.875rem;font-weight:500;color:var(--text-sec);transition:color .15s,background .15s}
    .nav-links a:hover,.nav-links a.active{color:var(--text);background:var(--bg-subtle)}
    .nav-links a.active{color:var(--accent)}
    .btn{display:inline-flex;align-items:center;gap:8px;padding:9px 18px;border-radius:var(--radius-sm);font-family:"Inter",sans-serif;font-size:.875rem;font-weight:500;cursor:pointer;transition:opacity .15s,background .15s,border-color .15s;white-space:nowrap;border:1px solid transparent}
    .btn svg{width:1rem;height:1rem}
    .btn-primary{background:var(--accent);color:#000;border-color:var(--accent)}
    .btn-primary:hover{opacity:.88}
    .btn-secondary{background:var(--bg-subtle);color:var(--text);border-color:var(--border-mid)}
    .btn-secondary:hover{background:var(--bg-hover);border-color:var(--border-hover)}
    .btn-ghost{background:transparent;color:var(--accent);border-color:var(--border-mid)}
    .btn-ghost:hover{border-color:var(--accent);background:var(--accent-muted)}
    .badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:var(--radius-xs);font-size:.72rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;border:1px solid transparent}
    .badge-demo{color:var(--status-demo);background:rgba(255,107,0,.10);border-color:rgba(255,107,0,.20)}
    .badge-release{color:var(--status-release);background:rgba(34,197,94,.10);border-color:rgba(34,197,94,.20)}
    .badge-soon{color:var(--status-soon);background:rgba(107,114,128,.12);border-color:rgba(107,114,128,.20)}
    .badge-latest{color:var(--accent);background:var(--accent-dim);border-color:rgba(255,107,0,.25)}
    .tag{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;font-size:.78rem;font-weight:500;color:var(--text-sec);background:var(--bg-subtle);border:1px solid var(--border)}
    .footer{padding:40px 24px;border-top:1px solid var(--border);text-align:center;color:var(--text-muted);font-size:.8125rem}
    .footer a{color:var(--text-sec)}
    .footer a:hover{color:var(--accent)}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
    .skeleton{background:var(--bg-subtle);border-radius:var(--radius-sm);animation:pulse 1.6s ease-in-out infinite}

    /* Game Hero */
    .game-hero{position:relative;background:var(--bg-subtle);border-bottom:1px solid var(--border);overflow:hidden}
    .game-hero-banner{width:100%;aspect-ratio:21/7;background:var(--bg-subtle);position:relative;overflow:hidden}
    .game-hero-banner img{width:100%;height:100%;object-fit:cover}
    .game-hero-banner-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--text-dim)}
    .game-hero-banner-placeholder svg{width:4rem;height:4rem}
    .game-hero-banner::after{content:'';position:absolute;bottom:0;left:0;right:0;height:50%;background:linear-gradient(to bottom,transparent,var(--bg-subtle))}
    .game-hero-content{max-width:var(--max-w);margin:0 auto;padding:28px 24px 32px}
    .game-hero h1{font-size:clamp(1.75rem,4vw,2.75rem);margin-bottom:6px}
    .game-hero-subtitle{font-size:1rem;color:var(--text-sec);margin-bottom:16px}
    .game-hero-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

    /* Tabs */
    .tab-nav{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:32px}
    .tab-btn{padding:10px 18px;font-size:.875rem;font-weight:500;color:var(--text-muted);background:transparent;border:none;border-bottom:2px solid transparent;cursor:pointer;transition:color .15s,border-color .15s;margin-bottom:-1px;font-family:"Inter",sans-serif}
    .tab-btn:hover{color:var(--text)}
    .tab-btn.active{color:var(--accent);border-bottom-color:var(--accent)}

    /* Section */
    .section{padding:40px 24px var(--section-gap)}
    .section-inner{max-width:var(--max-w);margin:0 auto}

    /* Info grid */
    .info-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:24px}
    .info-cell{background:var(--bg-card);padding:16px 20px}
    .info-label{font-size:.72rem;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--text-muted);margin-bottom:4px}
    .info-value{font-size:.9375rem;font-weight:500;color:var(--text)}
    @media(max-width:600px){.info-grid{grid-template-columns:repeat(2,1fr)}}

    /* Download card */
    .download-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:20px 24px;display:flex;flex-direction:column;gap:14px;transition:border-color .2s;margin-bottom:16px}
    .download-card:hover{border-color:var(--border-mid)}
    .download-card-header{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .download-platform{display:flex;align-items:center;gap:10px;font-weight:600;font-size:1rem}
    .download-platform svg{width:1.25rem;height:1.25rem;color:var(--text-sec)}
    .download-meta{display:flex;align-items:center;gap:16px;font-size:.8125rem;color:var(--text-sec)}
    .download-meta span{display:flex;align-items:center;gap:5px}
    .download-meta svg{width:.875rem;height:.875rem}
    .download-filename{font-size:.8rem;color:var(--text-muted);font-family:monospace}
    .download-note{display:flex;align-items:flex-start;gap:8px;padding:10px 14px;background:rgba(255,107,0,.06);border:1px solid rgba(255,107,0,.15);border-radius:var(--radius-sm);font-size:.8125rem;color:var(--text-sec)}
    .download-note svg{width:1rem;height:1rem;color:var(--accent);flex-shrink:0;margin-top:1px}

    /* Timeline */
    .timeline{display:flex;flex-direction:column;gap:0;position:relative;padding-left:28px}
    .timeline::before{content:'';position:absolute;left:7px;top:6px;bottom:6px;width:1px;background:var(--border)}
    .timeline-item{position:relative;padding:0 0 24px 24px}
    .timeline-dot{position:absolute;left:0;top:5px;width:15px;height:15px;border-radius:50%;background:var(--bg-card);border:2px solid var(--border-mid);z-index:1}
    .timeline-dot.has-release{border-color:var(--accent);background:var(--accent)}
    .timeline-item-header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
    .timeline-day{font-weight:600;font-size:.9375rem;color:var(--text)}
    .timeline-note{font-size:.875rem;color:var(--text-sec)}
    .timeline-date{font-size:.8rem;color:var(--text-muted);display:flex;align-items:center;gap:4px}
    .timeline-date svg{width:.8rem;height:.8rem}

    /* Link card */
    .link-card{display:flex;align-items:center;gap:14px;padding:16px 20px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);transition:border-color .2s,background .2s}
    .link-card:hover{border-color:var(--border-hover);background:var(--accent-muted)}
    .link-card-icon{width:40px;height:40px;display:flex;align-items:center;justify-content:center;background:var(--bg-subtle);border:1px solid var(--border);border-radius:var(--radius-sm);flex-shrink:0}
    .link-card-icon svg{width:1.125rem;height:1.125rem;color:var(--text-sec)}
    .link-card:hover .link-card-icon svg{color:var(--accent)}
    .link-card-text{flex:1}
    .link-card-name{font-weight:600;font-size:.9375rem;color:var(--text)}
    .link-card-url{font-size:.8rem;color:var(--text-muted)}
    .link-card-arrow{color:var(--text-dim)}
    .link-card-arrow svg{width:1rem;height:1rem}
    .grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
    @media(max-width:600px){.grid-2{grid-template-columns:1fr}}

    /* Screenshots */
    .screenshots-row{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;scrollbar-width:thin;scrollbar-color:var(--border-mid) transparent}
    .screenshots-row::-webkit-scrollbar{height:4px}
    .screenshots-row::-webkit-scrollbar-track{background:transparent}
    .screenshots-row::-webkit-scrollbar-thumb{background:var(--border-mid);border-radius:2px}
    .screenshot-thumb{flex-shrink:0;width:280px;aspect-ratio:16/9;border-radius:var(--radius-sm);border:1px solid var(--border);overflow:hidden;cursor:pointer;transition:border-color .2s}
    .screenshot-thumb:hover{border-color:var(--border-hover)}
    .screenshot-thumb img{width:100%;height:100%;object-fit:cover}

    /* Lightbox */
    .lightbox{position:fixed;inset:0;z-index:999;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;padding:24px}
    .lightbox img{max-width:100%;max-height:100%;border-radius:var(--radius-sm);object-fit:contain}
    .lightbox-close{position:absolute;top:20px;right:20px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px;cursor:pointer;color:var(--text-sec);display:flex;align-items:center;justify-content:center}
    .lightbox-close:hover{color:var(--text);border-color:var(--border-mid)}
    .lightbox-close svg{width:1.25rem;height:1.25rem}

    /* desc label */
    .desc-lang-label{font-size:.72rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);margin-bottom:8px;display:block}
    .desc-block{padding:20px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:16px;color:var(--text-sec);line-height:1.75}
  </style>
</head>
<body>
<nav class="navbar">
  <div class="navbar-inner">
    <a href="index.html" class="nav-logo" id="nav-logo"><span>TAT</span> Studio</a>
    <ul class="nav-links" id="nav-links"></ul>
  </div>
</nav>

<div id="page-content">
  <div style="padding:80px 24px;text-align:center">
    <div class="skeleton" style="height:240px;border-radius:var(--radius);max-width:var(--max-w);margin:0 auto"></div>
  </div>
</div>

<div id="lightbox" class="lightbox" style="display:none">
  <button class="lightbox-close" id="lb-close">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
  </button>
  <img id="lb-img" src="" alt="">
</div>

<footer class="footer" id="footer"></footer>

<script>
const SITE={baseUrl:"https://www.timeandtime.online",dataUrl:{studio:"https://raw.githubusercontent.com/TimeAndTimeStudio/Battle-Mushroom/main/data/studio.json",games:"https://raw.githubusercontent.com/TimeAndTimeStudio/Battle-Mushroom/main/data/games.json"},nav:[{label:"หน้าแรก",href:"index.html"},{label:"เกม",href:"games.html"},{label:"Devlog",href:"devlog.html"},{label:"เกี่ยวกับ",href:"about.html"}]};
const ICONS={arrowRight:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>`,download:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>`,warning:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>`,clock:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>`,calendar:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>`,info:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>`,github:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/></svg>`,taptap:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12h8M12 8v8"/></svg>`,itch:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10c4-2 5 2 9 0s5-2 9 0"/></svg>`,package:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><line x1="16.5" y1="9.4" x2="7.5" y2="4.21"/><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>`,android:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l-2.5 4.5"/><path d="M7 2l2.5 4.5"/><rect x="2" y="6.5" width="20" height="13" rx="2"/><path d="M8 6.5v-2"/><path d="M16 6.5v-2"/><circle cx="9" cy="13" r="1"/><circle cx="15" cy="13" r="1"/></svg>`,windows:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5.5L11 4v7H3z"/><path d="M21 3.5L13 5v6h8z"/><path d="M3 18.5L11 20v-7H3z"/><path d="M21 20.5L13 19v-7h8z"/></svg>`,monitor:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>`,externalLink:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>`,image:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>`};

async function fetchJSON(url){try{const r=await fetch(url);if(!r.ok)throw new Error(r.status);return await r.json()}catch(e){console.error('[TAT]',url,e);return null}}
function renderNav(studio){const current=location.pathname.split('/').pop()||'index.html';const logoText=studio?studio.shortName.replace('TAT','<span>TAT</span>'):'<span>TAT</span> Studio';document.getElementById('nav-logo').innerHTML=logoText;const ul=document.getElementById('nav-links');ul.innerHTML=SITE.nav.map(n=>`<li><a href="${n.href}" class="${n.href===current?'active':''}">${n.label}</a></li>`).join('')}
function renderFooter(studio){const s=studio||{shortName:'TAT Studio',links:{}};document.getElementById('footer').innerHTML=`<p>&copy; ${new Date().getFullYear()} ${s.shortName}. All rights reserved.</p><p style="margin-top:8px"><a href="${s.links?.github||'#'}">GitHub</a> &nbsp;·&nbsp; <a href="${s.links?.youtube||'#'}">YouTube</a> &nbsp;·&nbsp; <a href="${s.links?.itch||'#'}">Itch.io</a></p>`}
function badgeHtml(status){const map={demo:['badge-demo','Demo'],released:['badge-release','Released'],'coming-soon':['badge-soon','Coming Soon']};const[cls,label]=map[status]||map['coming-soon'];return`<span class="badge ${cls}">${label}</span>`}

function platformIcon(key) {
  return ICONS[key] || ICONS.monitor;
}

function renderPage(game) {
  const info = game.info || {};
  const hasBanner = game.images?.banner;

  // Tabs content
  const tabAbout = `
    <div id="tab-about" class="tab-content">
      <span class="desc-lang-label">ภาษาไทย</span>
      <div class="desc-block">${game.description?.th || '—'}</div>
      <span class="desc-lang-label">English</span>
      <div class="desc-block">${game.description?.en || '—'}</div>
      <div class="info-grid" style="margin-top:8px">
        <div class="info-cell"><div class="info-label">Platform</div><div class="info-value">${info.platform||'—'}</div></div>
        <div class="info-cell"><div class="info-label">ขนาดไฟล์</div><div class="info-value">${info.size||'—'}</div></div>
        <div class="info-cell"><div class="info-label">เวอร์ชัน</div><div class="info-value">${info.version||'—'}</div></div>
        <div class="info-cell"><div class="info-label">ภาษา</div><div class="info-value">${info.language||'—'}</div></div>
        <div class="info-cell"><div class="info-label">ลิขสิทธิ์</div><div class="info-value">${info.license||'—'}</div></div>
        <div class="info-cell"><div class="info-label">วันที่วางจำหน่าย</div><div class="info-value">${info.releaseDate||'—'}</div></div>
      </div>
      <div style="margin-top:16px;display:flex;gap:6px;flex-wrap:wrap">${(game.tags||[]).map(t=>`<span class="tag">${t}</span>`).join('')}</div>
    </div>`;

  const dlCards = (game.downloads||[]).length > 0
    ? (game.downloads||[]).map(dl=>`
      <div class="download-card">
        <div class="download-card-header">
          <div class="download-platform">${platformIcon(dl.platformKey)} ${dl.platform}</div>
          <div style="display:flex;align-items:center;gap:8px">
            ${dl.isLatest?`<span class="badge badge-latest">ล่าสุด</span>`:''}
          </div>
        </div>
        <div class="download-meta">
          <span>${ICONS.info} ${dl.version}</span>
          <span>${ICONS.package} ${dl.size}</span>
          ${dl.date?`<span>${ICONS.calendar} ${dl.date}</span>`:''}
        </div>
        ${dl.filename?`<div class="download-filename">${dl.filename}</div>`:''}
        <a href="${dl.url}" class="btn btn-primary" target="_blank" rel="noopener">
          ${ICONS.download} ดาวน์โหลด ${dl.platform}
        </a>
        ${dl.note?`<div class="download-note">${ICONS.warning} ${dl.note}</div>`:''}
      </div>`).join('')
    : `<div style="padding:40px;text-align:center;color:var(--text-muted)">
        <div style="margin-bottom:12px">${ICONS.clock}</div>
        Coming Soon — ยังไม่มีไฟล์ดาวน์โหลด
      </div>`;

  const links = game.links || {};
  const linkItems = [
    links.taptap && {icon:'taptap',name:'TapTap',url:links.taptap,label:links.taptap.replace('https://','')},
    links.itch && {icon:'itch',name:'Itch.io',url:links.itch,label:links.itch.replace('https://','')},
    links.github && {icon:'github',name:'GitHub',url:links.github,label:links.github.replace('https://','')},
    links.githubReleases && {icon:'package',name:'GitHub Releases',url:links.githubReleases,label:links.githubReleases.replace('https://','')},
  ].filter(Boolean);

  const altLinks = linkItems.length ? `
    <h3 style="font-size:1rem;margin-bottom:16px;color:var(--text-muted);font-family:Inter,sans-serif;font-weight:500">ลิงก์ทางเลือก</h3>
    ${linkItems.map(l=>`
      <a href="${l.url}" class="link-card" target="_blank" rel="noopener" style="margin-bottom:10px">
        <div class="link-card-icon">${ICONS[l.icon]||''}</div>
        <div class="link-card-text"><div class="link-card-name">${l.name}</div><div class="link-card-url">${l.label}</div></div>
        <div class="link-card-arrow">${ICONS.externalLink}</div>
      </a>`).join('')}` : '';

  const tabDownload = `<div id="tab-download" class="tab-content" hidden>${dlCards}${altLinks}</div>`;

  // Devlog tab
  const sortedLog = [...(game.devlog||[])].sort((a,b)=>b.day-a.day);
  const devlogItems = sortedLog.map(entry=>`
    <div class="timeline-item">
      <div class="timeline-dot ${entry.version?'has-release':''}"></div>
      <div class="timeline-item-header">
        <span class="timeline-day">Day ${entry.day}</span>
        ${entry.version?`<span class="badge badge-demo" style="font-size:.7rem">${entry.version}</span>`:''}
        ${entry.isLatest?`<span class="badge badge-latest">ล่าสุด</span>`:''}
      </div>
      <p class="timeline-note">${entry.note}</p>
      ${entry.date?`<div class="timeline-date">${ICONS.calendar} ${entry.date}</div>`:''}
    </div>`).join('');

  const tabDevlog = `
    <div id="tab-devlog" class="tab-content" hidden>
      <div class="timeline">${devlogItems||'<p style="color:var(--text-muted)">ยังไม่มีบันทึก</p>'}</div>
      <div style="margin-top:24px">
        <a href="devlog.html?id=${game.id}" class="btn btn-ghost">${ICONS.arrowRight} ดู Devlog ทั้งหมด</a>
      </div>
    </div>`;

  const tabLinks = `
    <div id="tab-links" class="tab-content" hidden>
      <div class="grid-2">
        ${linkItems.map(l=>`
          <a href="${l.url}" class="link-card" target="_blank" rel="noopener">
            <div class="link-card-icon">${ICONS[l.icon]||''}</div>
            <div class="link-card-text"><div class="link-card-name">${l.name}</div><div class="link-card-url">${l.label}</div></div>
            <div class="link-card-arrow">${ICONS.externalLink}</div>
          </a>`).join('')}
      </div>
    </div>`;

  // Screenshots
  const shots = (game.images?.screenshots||[]).filter(s=>s);
  const screenshotsSection = shots.length ? `
    <section class="section" style="padding-top:0">
      <div class="section-inner">
        <h2 style="font-size:1.25rem;margin-bottom:20px">ภาพหน้าจอ</h2>
        <div class="screenshots-row">
          ${shots.map((s,i)=>`
            <div class="screenshot-thumb" onclick="openLb('${s}')">
              <img src="${s}" alt="Screenshot ${i+1}" loading="lazy">
            </div>`).join('')}
        </div>
      </div>
    </section>` : '';

  document.getElementById('page-content').innerHTML = `
    <div class="game-hero">
      <div class="game-hero-banner">
        ${hasBanner?`<img src="${hasBanner}" alt="${game.title}">`:`<div class="game-hero-banner-placeholder">${ICONS.image}</div>`}
      </div>
      <div class="game-hero-content">
        <h1>${game.title}</h1>
        <p class="game-hero-subtitle">${game.subtitle||''}</p>
        <div class="game-hero-meta">
          ${badgeHtml(game.status)}
          ${(game.tags||[]).map(t=>`<span class="tag">${t}</span>`).join('')}
        </div>
      </div>
    </div>
    <section class="section">
      <div class="section-inner">
        <div class="tab-nav">
          <button class="tab-btn active" data-tab="tab-about">เกี่ยวกับ</button>
          <button class="tab-btn" data-tab="tab-download">ดาวน์โหลด</button>
          <button class="tab-btn" data-tab="tab-devlog">Devlog</button>
          <button class="tab-btn" data-tab="tab-links">ลิงก์</button>
        </div>
        ${tabAbout}${tabDownload}${tabDevlog}${tabLinks}
      </div>
    </section>
    ${screenshotsSection}`;

  // Init tabs
  document.querySelectorAll('.tab-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c=>c.hidden=true);
      btn.classList.add('active');
      document.getElementById(btn.dataset.tab).hidden=false;
    });
  });
}

function openLb(src) {
  document.getElementById('lb-img').src=src;
  document.getElementById('lightbox').style.display='flex';
}
document.getElementById('lb-close').addEventListener('click',()=>{document.getElementById('lightbox').style.display='none'});
document.getElementById('lightbox').addEventListener('click',e=>{if(e.target===document.getElementById('lightbox'))document.getElementById('lightbox').style.display='none'});

async function init() {
  const id = new URLSearchParams(location.search).get('id');
  if (!id) { location.href='404.html'; return; }

  const [studio, games] = await Promise.all([fetchJSON(SITE.dataUrl.studio), fetchJSON(SITE.dataUrl.games)]);
  renderNav(studio);
  renderFooter(studio);

  if (!games) { document.getElementById('page-content').innerHTML=`<div style="padding:80px 24px;text-align:center;color:var(--text-muted)">ไม่สามารถโหลดข้อมูลได้</div>`; return; }

  const game = games.find(g=>g.id===id);
  if (!game) { location.href='404.html'; return; }

  document.title = `${game.title} — TAT Studio`;
  document.querySelector('meta[name=description]').content = (game.description?.th||'').slice(0,160);

  renderPage(game);
}
init();
</script>
</body>
</html>
