<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#FF6B00">
  <meta name="description" content="TAT Studio ผู้พัฒนาเกม Indie สัญชาติไทย — Battle Mushroom และเกมอื่นๆ ดาวน์โหลดฟรี">
  <meta property="og:image" content="https://img.tapimg.net/market/images/37f3779125fc38cf177bab91cd44da60.png">
  <link rel="canonical" href="https://www.timeandtime.online/">
  <title>TAT Studio — ผู้พัฒนาเกม Indie ไทย</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap');
    :root {
      --bg:#0D0D0D;--bg-card:#111111;--bg-subtle:#161616;--bg-hover:#1a1a1a;
      --border:#242424;--border-mid:#303030;--border-hover:#FF6B00;
      --accent:#FF6B00;--accent-dim:rgba(255,107,0,.10);--accent-muted:rgba(255,107,0,.06);
      --status-demo:#FF6B00;--status-release:#22C55E;--status-soon:#6B7280;
      --text:#E2E2E2;--text-sec:#A0A0A0;--text-muted:#6B6B6B;--text-dim:#404040;
      --radius:10px;--radius-sm:6px;--radius-xs:4px;--max-w:1080px;--nav-h:60px;
      --section-gap:80px;--card-pad:24px;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{font-size:16px;-webkit-font-smoothing:antialiased}
    body{background:var(--bg);color:var(--text);font-family:"Inter",system-ui,sans-serif;font-size:.9375rem;line-height:1.6}
    h1,h2,h3{font-family:"Space Grotesk",sans-serif;font-weight:600;letter-spacing:-.02em;line-height:1.25}
    h4,h5,h6,label,.label{font-family:"Inter",sans-serif;font-weight:500}
    a{color:inherit;text-decoration:none}
    img{display:block;max-width:100%}
    svg{flex-shrink:0}
    .icon{display:inline-flex;align-items:center;justify-content:center;width:1em;height:1em;vertical-align:middle}
    .icon svg{width:100%;height:100%}
    .icon-sm{width:.875rem;height:.875rem}.icon-md{width:1.125rem;height:1.125rem}
    .icon-lg{width:1.5rem;height:1.5rem}.icon-xl{width:2rem;height:2rem}.icon-2xl{width:2.5rem;height:2.5rem}
    .navbar{position:sticky;top:0;z-index:100;height:var(--nav-h);display:flex;align-items:center;padding:0 24px;background:rgba(13,13,13,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
    .navbar-inner{width:100%;max-width:var(--max-w);margin:0 auto;display:flex;align-items:center;gap:32px}
    .nav-logo{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:1rem;letter-spacing:-.01em;color:var(--text)}
    .nav-logo span{color:var(--accent)}
    .nav-links{display:flex;gap:4px;margin-left:auto;list-style:none}
    .nav-links a{display:flex;align-items:center;gap:6px;padding:6px 14px;border-radius:var(--radius-sm);font-size:.875rem;font-weight:500;color:var(--text-sec);transition:color .15s,background .15s}
    .nav-links a:hover,.nav-links a.active{color:var(--text);background:var(--bg-subtle)}
    .nav-links a.active{color:var(--accent)}
    .card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:var(--card-pad);transition:border-color .2s,box-shadow .2s}
    .card:hover{border-color:var(--border-mid);box-shadow:0 0 0 1px var(--border-mid)}
    .card.interactive:hover{border-color:var(--border-hover);box-shadow:0 0 0 1px var(--accent-dim)}
    .btn{display:inline-flex;align-items:center;gap:8px;padding:9px 18px;border-radius:var(--radius-sm);font-family:"Inter",sans-serif;font-size:.875rem;font-weight:500;cursor:pointer;transition:opacity .15s,background .15s,border-color .15s;white-space:nowrap;border:1px solid transparent}
    .btn svg{width:1rem;height:1rem}
    .btn-primary{background:var(--accent);color:#000;border-color:var(--accent)}
    .btn-primary:hover{opacity:.88}
    .btn-secondary{background:var(--bg-subtle);color:var(--text);border-color:var(--border-mid)}
    .btn-secondary:hover{background:var(--bg-hover);border-color:var(--border-hover)}
    .btn-ghost{background:transparent;color:var(--accent);border-color:var(--border-mid)}
    .btn-ghost:hover{border-color:var(--accent);background:var(--accent-muted)}
    .btn-text{background:transparent;color:var(--text-sec);border-color:transparent;padding-left:4px;padding-right:4px}
    .btn-text:hover{color:var(--text)}
    .badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:var(--radius-xs);font-size:.72rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;border:1px solid transparent}
    .badge-demo{color:var(--status-demo);background:rgba(255,107,0,.10);border-color:rgba(255,107,0,.20)}
    .badge-release{color:var(--status-release);background:rgba(34,197,94,.10);border-color:rgba(34,197,94,.20)}
    .badge-soon{color:var(--status-soon);background:rgba(107,114,128,.12);border-color:rgba(107,114,128,.20)}
    .tag{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;font-size:.78rem;font-weight:500;color:var(--text-sec);background:var(--bg-subtle);border:1px solid var(--border)}
    .divider{width:100%;height:1px;background:var(--border);margin:32px 0}
    .section{padding:var(--section-gap) 24px}
    .section-inner{max-width:var(--max-w);margin:0 auto}
    .section-header{margin-bottom:40px}
    .section-header h2{font-size:1.75rem;color:var(--text)}
    .section-header p{margin-top:8px;color:var(--text-sec);font-size:.9375rem}
    .section-header-row{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap}
    .grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
    .grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
    @media(max-width:900px){.grid-3{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:600px){.grid-3,.grid-2{grid-template-columns:1fr}}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
    .skeleton{background:var(--bg-subtle);border-radius:var(--radius-sm);animation:pulse 1.6s ease-in-out infinite}
    .fade{opacity:0;transform:translateY(16px);transition:opacity .4s ease,transform .4s ease}
    .fade.visible{opacity:1;transform:none}
    .footer{padding:40px 24px;border-top:1px solid var(--border);text-align:center;color:var(--text-muted);font-size:.8125rem}
    .footer a{color:var(--text-sec)}
    .footer a:hover{color:var(--accent)}
    .thumb{width:100%;aspect-ratio:16/9;background:var(--bg-subtle);border-radius:var(--radius-sm);border:1px solid var(--border);overflow:hidden}
    .thumb img{width:100%;height:100%;object-fit:cover}
    .thumb-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--text-dim)}
    .thumb-placeholder svg{width:2rem;height:2rem}
    .link-card{display:flex;align-items:center;gap:14px;padding:16px 20px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);transition:border-color .2s,background .2s}
    .link-card:hover{border-color:var(--border-hover);background:var(--accent-muted)}
    .link-card-icon{width:40px;height:40px;display:flex;align-items:center;justify-content:center;background:var(--bg-subtle);border:1px solid var(--border);border-radius:var(--radius-sm);flex-shrink:0}
    .link-card-icon svg{width:1.125rem;height:1.125rem;color:var(--text-sec)}
    .link-card:hover .link-card-icon svg{color:var(--accent)}
    .link-card-text{flex:1}
    .link-card-name{font-weight:600;font-size:.9375rem;color:var(--text)}
    .link-card-url{font-size:.8rem;color:var(--text-muted)}
    .link-card-arrow{color:var(--text-dim)}
    .link-card-arrow svg{width:1rem;height:1rem}

    /* Hero */
    .hero{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg-subtle);position:relative;overflow:hidden;padding:80px 24px}
    .hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 80% 60% at 50% 40%,rgba(255,107,0,.06) 0%,transparent 70%)}
    .hero::after{content:'';position:absolute;bottom:0;left:0;right:0;height:120px;background:linear-gradient(to bottom,transparent,var(--bg))}
    .hero-inner{max-width:var(--max-w);width:100%;margin:0 auto;position:relative;z-index:1}
    .hero-kicker{display:inline-flex;align-items:center;gap:8px;padding:4px 12px;border-radius:999px;border:1px solid var(--border-mid);font-size:.75rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);margin-bottom:28px}
    .hero-kicker-dot{width:6px;height:6px;border-radius:50%;background:var(--accent)}
    .hero-title{font-size:clamp(2.5rem,6vw,4rem);font-weight:700;color:var(--text);margin-bottom:4px}
    .hero-title .accent-dot{color:var(--accent)}
    .hero-tagline{font-size:clamp(1rem,2.5vw,1.375rem);color:var(--text-sec);font-family:"Inter",sans-serif;font-weight:400;margin-bottom:32px}
    .hero-meta{display:flex;align-items:center;gap:24px;margin-bottom:40px;flex-wrap:wrap}
    .hero-stat{display:flex;flex-direction:column}
    .hero-stat-num{font-family:"Space Grotesk",sans-serif;font-size:1.75rem;font-weight:700;color:var(--accent);line-height:1}
    .hero-stat-label{font-size:.75rem;font-weight:500;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em}
    .hero-sep{width:1px;height:40px;background:var(--border)}
    .hero-actions{display:flex;gap:12px;flex-wrap:wrap}

    /* Featured */
    .featured-grid{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center}
    @media(max-width:700px){.featured-grid{grid-template-columns:1fr}}
    .featured-badge-row{display:flex;align-items:center;gap:10px;margin-bottom:12px}
    .featured-label{font-size:.72rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted)}
    .featured-title{font-size:2rem;color:var(--text);margin-bottom:8px}
    .featured-subtitle{font-size:1rem;color:var(--text-sec);margin-bottom:16px}
    .featured-desc{color:var(--text-sec);font-size:.9375rem;line-height:1.7;margin-bottom:28px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
    .featured-actions{display:flex;gap:12px;flex-wrap:wrap}

    /* Game card */
    .game-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;transition:border-color .2s,box-shadow .2s}
    .game-card:hover{border-color:var(--border-mid);box-shadow:0 4px 20px rgba(0,0,0,.4)}
    .game-card-body{padding:var(--card-pad);flex:1;display:flex;flex-direction:column}
    .game-card-meta{display:flex;align-items:center;gap:8px;margin-bottom:10px}
    .game-card-title{font-size:1.0625rem;font-weight:600;color:var(--text);margin-bottom:6px}
    .game-card-desc{color:var(--text-sec);font-size:.875rem;line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:12px;flex:1}
    .game-card-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
    .game-card-actions{display:flex;gap:8px;flex-wrap:wrap}

    /* Mini bio */
    .mini-bio-logo{width:72px;height:72px;border-radius:var(--radius);background:var(--bg-subtle);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;margin-bottom:20px}
    .mini-bio-logo svg{width:2rem;height:2rem;color:var(--text-muted)}
    .mini-bio-name{font-size:1.5rem;margin-bottom:4px}
    .mini-bio-tagline{color:var(--text-sec);margin-bottom:16px}
    .mini-bio-about{color:var(--text-sec);line-height:1.75;margin-bottom:28px;max-width:640px}
  </style>
</head>
<body>

<nav class="navbar">
  <div class="navbar-inner">
    <a href="index.html" class="nav-logo" id="nav-logo">TAT Studio</a>
    <ul class="nav-links" id="nav-links"></ul>
  </div>
</nav>

<!-- HERO -->
<section class="hero" id="hero">
  <div class="hero-inner">
    <div class="hero-kicker fade">
      <span class="hero-kicker-dot"></span>
      Indie Game Studio · ไทย
    </div>
    <h1 class="hero-title fade">
      <span id="hero-studio-name">TAT Studio</span><span class="accent-dot">.</span>
    </h1>
    <p class="hero-tagline fade" id="hero-tagline">ผู้พัฒนาเกม Indie สัญชาติไทย</p>
    <div class="hero-meta fade">
      <div class="hero-stat">
        <span class="hero-stat-num" id="hero-game-count">—</span>
        <span class="hero-stat-label">เกม</span>
      </div>
      <div class="hero-sep"></div>
      <div class="hero-stat">
        <span class="hero-stat-num">Free</span>
        <span class="hero-stat-label">ดาวน์โหลด</span>
      </div>
      <div class="hero-sep"></div>
      <div class="hero-stat">
        <span class="hero-stat-num">Multi</span>
        <span class="hero-stat-label">Platform</span>
      </div>
    </div>
    <div class="hero-actions fade">
      <a href="games.html" class="btn btn-primary">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="12" x2="10" y2="12"/><line x1="8" y1="10" x2="8" y2="14"/><line x1="15" y1="13" x2="15.01" y2="13"/><line x1="18" y1="11" x2="18.01" y2="11"/><rect x="2" y="8" width="20" height="8" rx="4"/></svg>
        ดูเกมทั้งหมด
      </a>
      <button class="btn btn-secondary" onclick="document.getElementById('featured').scrollIntoView({behavior:'smooth'})">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        เลื่อนดู
      </button>
    </div>
  </div>
</section>

<!-- FEATURED GAME -->
<section class="section" id="featured">
  <div class="section-inner">
    <div id="featured-content">
      <div class="skeleton" style="height:400px;border-radius:var(--radius)"></div>
    </div>
  </div>
</section>

<!-- GAMES PREVIEW -->
<section class="section" style="padding-top:0">
  <div class="section-inner">
    <div class="section-header section-header-row">
      <div>
        <h2>เกมล่าสุด</h2>
        <p>ผลงานล่าสุดจาก TAT Studio</p>
      </div>
      <a href="games.html" class="btn btn-text">
        ดูทั้งหมด
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </a>
    </div>
    <div class="grid-3" id="games-grid">
      <div class="skeleton" style="height:320px;border-radius:var(--radius)"></div>
      <div class="skeleton" style="height:320px;border-radius:var(--radius)"></div>
      <div class="skeleton" style="height:320px;border-radius:var(--radius)"></div>
    </div>
  </div>
</section>

<!-- MINI BIO -->
<section class="section" style="padding-top:0">
  <div class="section-inner">
    <div class="card fade" id="mini-bio">
      <div class="skeleton" style="height:180px;border-radius:var(--radius-sm)"></div>
    </div>
  </div>
</section>

<footer class="footer" id="footer"></footer>

<script>
const SITE = {
  baseUrl: "https://www.timeandtime.online",
  dataUrl: {
    studio: "https://raw.githubusercontent.com/TimeAndTimeStudio/Battle-Mushroom/main/data/studio.json",
    games:  "https://raw.githubusercontent.com/TimeAndTimeStudio/Battle-Mushroom/main/data/games.json",
  },
  nav: [
    { label: "หน้าแรก",  href: "index.html"  },
    { label: "เกม",      href: "games.html"  },
    { label: "Devlog",   href: "devlog.html" },
    { label: "เกี่ยวกับ", href: "about.html" },
  ]
};

const ICONS = {
  home:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9.5z"/><path d="M9 21V12h6v9"/></svg>`,
  arrowRight:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>`,
  arrowLeft:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>`,
  download:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>`,
  image:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>`,
  github:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/></svg>`,
  youtube:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M22.54 6.42a2.78 2.78 0 0 0-1.95-1.96C18.88 4 12 4 12 4s-6.88 0-8.59.46a2.78 2.78 0 0 0-1.95 1.96A29 29 0 0 0 1 12a29 29 0 0 0 .46 5.58A2.78 2.78 0 0 0 3.41 19.6C5.12 20 12 20 12 20s6.88 0 8.59-.46a2.78 2.78 0 0 0 1.95-1.95A29 29 0 0 0 23 12a29 29 0 0 0-.46-5.58z"/><polygon points="9.75 15.02 15.5 12 9.75 8.98 9.75 15.02"/></svg>`,
  externalLink:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>`,
  gamepad:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="12" x2="10" y2="12"/><line x1="8" y1="10" x2="8" y2="14"/><line x1="15" y1="13" x2="15.01" y2="13"/><line x1="18" y1="11" x2="18.01" y2="11"/><rect x="2" y="8" width="20" height="8" rx="4"/></svg>`,
  warning:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>`,
};

async function fetchJSON(url) {
  try {
    const r = await fetch(url);
    if (!r.ok) throw new Error(r.status);
    return await r.json();
  } catch(e) {
    console.error('[TAT]', url, e);
    return null;
  }
}

function renderNav(studio) {
  const current = location.pathname.split('/').pop() || 'index.html';
  const logoText = studio ? studio.shortName.replace('TAT','<span>TAT</span>') : '<span>TAT</span> Studio';
  document.getElementById('nav-logo').innerHTML = logoText;
  const ul = document.getElementById('nav-links');
  ul.innerHTML = SITE.nav.map(n=>`
    <li><a href="${n.href}" class="${n.href===current?'active':''}">${n.label}</a></li>`).join('');
}

function renderFooter(studio) {
  const s = studio || {shortName:'TAT Studio', links:{}};
  document.getElementById('footer').innerHTML = `
    <p>&copy; ${new Date().getFullYear()} ${s.shortName}. All rights reserved.</p>
    <p style="margin-top:8px">
      <a href="${s.links?.github||'#'}">GitHub</a> &nbsp;·&nbsp;
      <a href="${s.links?.youtube||'#'}">YouTube</a> &nbsp;·&nbsp;
      <a href="${s.links?.itch||'#'}">Itch.io</a>
    </p>`;
}

function badgeHtml(status) {
  const map = {demo:['badge-demo','Demo'],released:['badge-release','Released'],'coming-soon':['badge-soon','Coming Soon']};
  const [cls,label] = map[status] || map['coming-soon'];
  return `<span class="badge ${cls}">${label}</span>`;
}

function initFade() {
  const obs = new IntersectionObserver(entries=>
    entries.forEach(e=>e.isIntersecting&&e.target.classList.add('visible')),{threshold:.1});
  document.querySelectorAll('.fade').forEach(el=>obs.observe(el));
}

function thumbHtml(img) {
  return img
    ? `<img src="${img}" alt="" loading="lazy">`
    : `<div class="thumb-placeholder"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg></div>`;
}

function renderGameCard(g) {
  const dlUrl = g.downloads?.[0]?.url || '#';
  return `
    <div class="game-card fade">
      <div class="thumb">${thumbHtml(g.images?.banner)}</div>
      <div class="game-card-body">
        <div class="game-card-meta">${badgeHtml(g.status)}</div>
        <h3 class="game-card-title">${g.title}</h3>
        <p class="game-card-desc">${g.description?.th || ''}</p>
        <div class="game-card-tags">${(g.tags||[]).map(t=>`<span class="tag">${t}</span>`).join('')}</div>
        <div class="game-card-actions">
          <a href="${dlUrl}" class="btn btn-primary" target="_blank" rel="noopener">
            ${ICONS.download} ดาวน์โหลด
          </a>
          <a href="game.html?id=${g.id}" class="btn btn-secondary">
            ${ICONS.arrowRight} รายละเอียด
          </a>
        </div>
      </div>
    </div>`;
}

async function init() {
  const [studio, games] = await Promise.all([
    fetchJSON(SITE.dataUrl.studio),
    fetchJSON(SITE.dataUrl.games)
  ]);

  renderNav(studio);
  renderFooter(studio);

  if (studio) {
    document.getElementById('hero-studio-name').textContent = studio.shortName;
    document.getElementById('hero-tagline').textContent = studio.tagline;
  }

  if (games) {
    document.getElementById('hero-game-count').textContent = games.length;

    // Featured
    const featured = games.find(g=>g.isFeatured) || games[0];
    if (featured) {
      const dlUrl = featured.downloads?.[0]?.url || '#';
      document.getElementById('featured-content').innerHTML = `
        <div class="featured-grid fade">
          <div class="thumb" style="border-radius:var(--radius)">${thumbHtml(featured.images?.banner)}</div>
          <div>
            <div class="featured-badge-row">
              <span class="featured-label">Featured Game</span>
              ${badgeHtml(featured.status)}
            </div>
            <h2 class="featured-title">${featured.title}</h2>
            <p class="featured-subtitle">${featured.subtitle}</p>
            <p class="featured-desc">${featured.description?.th || ''}</p>
            <div class="featured-actions">
              <a href="${dlUrl}" class="btn btn-primary" target="_blank" rel="noopener">
                ${ICONS.download} ดาวน์โหลด
              </a>
              <a href="game.html?id=${featured.id}" class="btn btn-ghost">
                ${ICONS.arrowRight} รายละเอียด
              </a>
            </div>
          </div>
        </div>`;
    }

    // Games grid (up to 3)
    const recent = games.slice(0,3);
    document.getElementById('games-grid').innerHTML = recent.map(renderGameCard).join('');
  }

  // Mini bio
  if (studio) {
    document.getElementById('mini-bio').innerHTML = `
      <div class="mini-bio-logo">
        ${studio.logo ? `<img src="${studio.logo}" alt="${studio.shortName}">` : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>`}
      </div>
      <h2 class="mini-bio-name">${studio.name}</h2>
      <p class="mini-bio-tagline">${studio.tagline}</p>
      <p class="mini-bio-about">${studio.about}</p>
      <div class="grid-2" style="max-width:480px;margin-bottom:24px">
        <a href="${studio.links?.github||'#'}" class="link-card" target="_blank" rel="noopener">
          <div class="link-card-icon">${ICONS.github}</div>
          <div class="link-card-text">
            <div class="link-card-name">GitHub</div>
            <div class="link-card-url">TimeAndTimeStudio</div>
          </div>
          <div class="link-card-arrow">${ICONS.externalLink}</div>
        </a>
        <a href="${studio.links?.youtube||'#'}" class="link-card" target="_blank" rel="noopener">
          <div class="link-card-icon">${ICONS.youtube}</div>
          <div class="link-card-text">
            <div class="link-card-name">YouTube</div>
            <div class="link-card-url">@TAT_Game_Real</div>
          </div>
          <div class="link-card-arrow">${ICONS.externalLink}</div>
        </a>
      </div>
      <a href="about.html" class="btn btn-ghost">
        ${ICONS.arrowRight} เกี่ยวกับเรา
      </a>`;
  }

  initFade();

  // JSON-LD
  if (studio) {
    const schema = {"@context":"https://schema.org","@type":"Organization","name":studio.name,"url":SITE.baseUrl,"sameAs":Object.values(studio.links||{})};
    const s = document.createElement('script');
    s.type='application/ld+json';
    s.textContent=JSON.stringify(schema);
    document.head.appendChild(s);
  }
}

init();
</script>
</body>
</html>
