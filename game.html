<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Game Detail — TAT Studio">
  <meta name="theme-color" content="#0D0D0D">
  <title>Game Detail — TAT Studio</title>

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%23FF6B00'/><text x='50' y='60' font-size='60' font-weight='bold' fill='%23000'>T</text></svg>">
  <link rel="canonical" href="https://www.timeandtime.online/game.html">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap');

    :root {
      --bg: #0D0D0D;
      --bg-card: #111111;
      --bg-subtle: #161616;
      --bg-hover: #1a1a1a;
      --border: #242424;
      --border-mid: #303030;
      --border-hover: #FF6B00;
      --accent: #FF6B00;
      --accent-dim: rgba(255, 107, 0, 0.10);
      --accent-muted: rgba(255, 107, 0, 0.06);
      --status-demo: #FF6B00;
      --status-release: #22C55E;
      --status-soon: #6B7280;
      --text: #E2E2E2;
      --text-sec: #A0A0A0;
      --text-muted: #6B6B6B;
      --text-dim: #404040;
      --radius: 10px;
      --radius-sm: 6px;
      --radius-xs: 4px;
      --max-w: 1080px;
      --nav-h: 60px;
      --section-gap: 80px;
      --card-pad: 24px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; -webkit-font-smoothing: antialiased; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Inter", system-ui, sans-serif;
      font-size: 0.9375rem;
      line-height: 1.6;
    }
    h1, h2, h3 {
      font-family: "Space Grotesk", sans-serif;
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.25;
    }
    h4, h5, h6, label, .label { font-family: "Inter", sans-serif; font-weight: 500; }
    a { color: inherit; text-decoration: none; }
    img { display: block; max-width: 100%; }
    svg { flex-shrink: 0; }

    .icon { display: inline-flex; align-items: center; justify-content: center; width: 1em; height: 1em; vertical-align: middle; }
    .icon svg { width: 100%; height: 100%; }

    .navbar {
      position: sticky;
      top: 0;
      z-index: 100;
      height: var(--nav-h);
      display: flex;
      align-items: center;
      padding: 0 24px;
      background: rgba(13, 13, 13, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }
    .navbar-inner { width: 100%; max-width: var(--max-w); margin: 0 auto; display: flex; align-items: center; gap: 32px; }
    .nav-logo { font-family: "Space Grotesk", sans-serif; font-weight: 700; font-size: 1rem; color: var(--text); }
    .nav-logo span { color: var(--accent); }
    .nav-links { display: flex; gap: 4px; margin-left: auto; list-style: none; }
    .nav-links a {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: var(--radius-sm);
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text-sec);
      transition: color 0.15s, background 0.15s;
    }
    .nav-links a:hover, .nav-links a.active { color: var(--text); background: var(--bg-subtle); }
    .nav-links a.active { color: var(--accent); }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: var(--card-pad);
      transition: border-color 0.2s;
    }
    .card:hover { border-color: var(--border-mid); }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 18px;
      border-radius: var(--radius-sm);
      font-family: "Inter", sans-serif;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.15s, background 0.15s;
      border: 1px solid transparent;
    }
    .btn svg { width: 1rem; height: 1rem; }

    .btn-primary { background: var(--accent); color: #000; border-color: var(--accent); }
    .btn-primary:hover { opacity: 0.88; }

    .btn-secondary { background: var(--bg-subtle); color: var(--text); border-color: var(--border-mid); }
    .btn-secondary:hover { background: var(--bg-hover); border-color: var(--border-hover); }

    .btn-ghost { background: transparent; color: var(--accent); border-color: var(--border-mid); }
    .btn-ghost:hover { border-color: var(--accent); background: var(--accent-muted); }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 9px;
      border-radius: var(--radius-xs);
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      border: 1px solid transparent;
    }
    .badge-demo { color: var(--status-demo); background: rgba(255,107,0,0.10); border-color: rgba(255,107,0,0.20); }
    .badge-release { color: var(--status-release); background: rgba(34,197,94,0.10); border-color: rgba(34,197,94,0.20); }
    .badge-soon { color: var(--status-soon); background: rgba(107,114,128,0.12); border-color: rgba(107,114,128,0.20); }
    .badge-latest { color: var(--accent); background: var(--accent-dim); border-color: rgba(255,107,0,0.25); }

    .tag {
      display: inline-flex;
      align-items: center;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--text-sec);
      background: var(--bg-subtle);
      border: 1px solid var(--border);
    }

    .section {
      padding: var(--section-gap) 24px;
    }
    .section-inner {
      max-width: var(--max-w);
      margin: 0 auto;
    }

    .thumb {
      width: 100%;
      aspect-ratio: 16/9;
      background: var(--bg-subtle);
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      overflow: hidden;
    }
    .thumb-placeholder { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; color: var(--text-dim); }
    .thumb-placeholder svg { width: 3rem; height: 3rem; }

    .game-hero {
      position: relative;
      height: 400px;
      background: var(--bg-subtle);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .game-hero::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 150px;
      background: linear-gradient(to bottom, transparent, rgba(13, 13, 13, 0.8));
      pointer-events: none;
    }
    .game-hero-info {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 40px 24px;
      z-index: 1;
    }
    .game-hero-info h1 {
      font-size: 2.5rem;
      margin-bottom: 8px;
      color: var(--text);
    }
    .game-hero-info .subtitle {
      font-size: 1.125rem;
      color: var(--text-sec);
      margin-bottom: 12px;
    }
    .game-hero-info .tags { display: flex; gap: 6px; flex-wrap: wrap; }

    .tab-nav {
      display: flex;
      gap: 2px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 32px;
    }
    .tab-btn {
      padding: 10px 18px;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text-muted);
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
      margin-bottom: -1px;
    }
    .tab-btn:hover { color: var(--text); }
    .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1px;
      background: var(--border);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      margin-bottom: 32px;
    }
    .info-cell {
      background: var(--bg-card);
      padding: 16px 20px;
    }
    .info-label { font-size: 0.72rem; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 4px; }
    .info-value { font-size: 0.9375rem; font-weight: 500; color: var(--text); }
    @media (max-width: 600px) { .info-grid { grid-template-columns: repeat(2, 1fr); } }

    .download-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      transition: border-color 0.2s;
      margin-bottom: 16px;
    }
    .download-card:hover { border-color: var(--border-mid); }
    .download-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .download-platform { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 1rem; }
    .download-platform svg { width: 1.25rem; height: 1.25rem; color: var(--text-sec); }
    .download-meta { display: flex; align-items: center; gap: 16px; font-size: 0.8125rem; color: var(--text-sec); }
    .download-meta span { display: flex; align-items: center; gap: 5px; }
    .download-filename { font-size: 0.8rem; color: var(--text-muted); font-family: monospace; }
    .download-note {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 10px 14px;
      background: rgba(255, 107, 0, 0.06);
      border: 1px solid rgba(255, 107, 0, 0.15);
      border-radius: var(--radius-sm);
      font-size: 0.8125rem;
      color: var(--text-sec);
    }
    .download-note svg { width: 1rem; height: 1rem; color: var(--accent); flex-shrink: 0; margin-top: 1px; }

    .timeline {
      display: flex;
      flex-direction: column;
      gap: 0;
      position: relative;
      padding-left: 28px;
    }
    .timeline::before {
      content: '';
      position: absolute;
      left: 7px;
      top: 6px;
      bottom: 6px;
      width: 1px;
      background: var(--border);
    }
    .timeline-item {
      position: relative;
      padding: 0 0 24px 24px;
    }
    .timeline-dot {
      position: absolute;
      left: 0;
      top: 5px;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: var(--bg-card);
      border: 2px solid var(--border-mid);
      z-index: 1;
    }
    .timeline-dot.has-release { border-color: var(--accent); background: var(--accent); }
    .timeline-item-header { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
    .timeline-day { font-weight: 600; font-size: 0.9375rem; color: var(--text); }
    .timeline-note { font-size: 0.875rem; color: var(--text-sec); }
    .timeline-date { font-size: 0.8rem; color: var(--text-muted); display: flex; align-items: center; gap: 4px; }

    .link-card {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 20px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      transition: border-color 0.2s, background 0.2s;
      margin-bottom: 12px;
    }
    .link-card:hover { border-color: var(--border-hover); background: var(--accent-muted); }
    .link-card-icon {
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      flex-shrink: 0;
    }
    .link-card-icon svg { width: 1.125rem; height: 1.125rem; color: var(--text-sec); }
    .link-card:hover .link-card-icon svg { color: var(--accent); }
    .link-card-text { flex: 1; }
    .link-card-name { font-weight: 600; font-size: 0.9375rem; color: var(--text); }
    .link-card-url { font-size: 0.8rem; color: var(--text-muted); }
    .link-card-arrow { color: var(--text-dim); }
    .link-card-arrow svg { width: 1rem; height: 1rem; }

    .footer {
      padding: 40px 24px;
      border-top: 1px solid var(--border);
      text-align: center;
      color: var(--text-muted);
      font-size: 0.8125rem;
    }
  </style>
</head>
<body>
  <script>
    const SITE = {
      baseUrl: "https://www.timeandtime.online",
      dataUrl: {
        studio: "https://raw.githubusercontent.com/TimeAndTimeStudio/Battle-Mushroom/main/data/studio.json",
        games:  "https://raw.githubusercontent.com/TimeAndTimeStudio/Battle-Mushroom/main/data/games.json",
      },
      nav: [
        { label: "หน้าแรก",  href: "index.html"  },
        { label: "เกม",      href: "games.html"  },
        { label: "Devlog",   href: "devlog.html" },
        { label: "เกี่ยวกับ", href: "about.html" },
      ]
    };

    const ICONS = {
      warning: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3.05h16.94a2 2 0 0 0 1.71-3.05L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>`,
      download: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>`,
      calendar: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>`,
      externalLink: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>`,
      arrowRight: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>`,
      android: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17H4a2 2 0 0 1-2-2V9c0-1.1.9-2 2-2h16a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2h-3"/><line x1="9" y1="6" x2="9" y2="4"/><line x1="15" y1="6" x2="15" y2="4"/><circle cx="9" cy="17" r="0.5"/><circle cx="15" cy="17" r="0.5"/></svg>`,
      windows: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="12 3 20 7 20 17 12 21 4 17 4 7 12 3"/></svg>`,
      monitor: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>`,
      github: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/></svg>`,
      taptap: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="4"/><circle cx="18" cy="18" r="4"/><path d="M10 8l4 4M14 16l-4-4"/></svg>`,
      itch: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 9v6M12 9v6M15 9v6"/></svg>`,
      package: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="16.5" y1="9.4" x2="7.5" y2="4.21"/><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>`,
      image: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>`,
    };

    async function fetchJSON(url) {
      try {
        const r = await fetch(url);
        if (!r.ok) throw new Error(r.status);
        return await r.json();
      } catch (e) {
        console.error('[TAT]', url, e);
        return null;
      }
    }

    function badgeHtml(status) {
      const map = {
        demo: ['badge-demo', 'Demo'],
        released: ['badge-release', 'Released'],
        'coming-soon': ['badge-soon', 'Coming Soon'],
      };
      const [cls, label] = map[status] || map['coming-soon'];
      return `<span class="badge ${cls}">${label}</span>`;
    }

    function renderNav(studio) {
      const current = location.pathname.split('/').pop() || 'index.html';
      const logo = document.getElementById('nav-logo');
      logo.innerHTML = studio ? `${studio.shortName.split(' ')[0]}<span>.</span>` : 'TAT<span>.</span>';

      const ul = document.getElementById('nav-links');
      ul.innerHTML = SITE.nav.map(n => `<li><a href="${n.href}" class="${current === n.href ? 'active' : ''}">${n.label}</a></li>`).join('');
    }

    function renderFooter(studio) {
      const s = studio || { shortName: 'TAT Studio' };
      document.getElementById('footer').innerHTML = `&copy; ${new Date().getFullYear()} ${s.shortName}. All rights reserved.`;
    }

    function getPlatformIcon(key) {
      const map = {
        android: ICONS.android,
        windows: ICONS.windows,
        ios: ICONS.monitor,
        macos: ICONS.monitor,
        web: ICONS.monitor,
      };
      return map[key] || ICONS.monitor;
    }

    function renderGame(game) {
      document.title = `${game.title} — TAT Studio`;

      const hero = document.getElementById('game-hero');
      hero.innerHTML = `
        <div class="game-hero-info">
          ${badgeHtml(game.status)}
          <h1>${game.title}</h1>
          <p class="subtitle">${game.subtitle}</p>
          <div class="tags">
            ${game.tags.slice(0, 4).map(t => `<span class="tag">${t}</span>`).join('')}
          </div>
        </div>
      `;

      const about = document.getElementById('tab-about');
      about.innerHTML = `
        <div style="margin-bottom: 32px;">
          <h3 style="font-size: 1.125rem; margin-bottom: 16px; display: flex; align-items: center; gap: 8px;">
            <span>ภาษาไทย</span>
          </h3>
          <p style="color: var(--text-sec); line-height: 1.8;">${game.description.th}</p>
        </div>
        <div style="margin-bottom: 32px;">
          <h3 style="font-size: 1.125rem; margin-bottom: 16px; display: flex; align-items: center; gap: 8px;">
            <span>English</span>
          </h3>
          <p style="color: var(--text-sec); line-height: 1.8;">${game.description.en}</p>
        </div>
        <div class="info-grid">
          <div class="info-cell"><div class="info-label">Platform</div><div class="info-value">${game.info.platform}</div></div>
          <div class="info-cell"><div class="info-label">File Size</div><div class="info-value">${game.info.size}</div></div>
          <div class="info-cell"><div class="info-label">Version</div><div class="info-value">${game.info.version}</div></div>
          <div class="info-cell"><div class="info-label">Language</div><div class="info-value">${game.info.language}</div></div>
          <div class="info-cell"><div class="info-label">License</div><div class="info-value">${game.info.license}</div></div>
          <div class="info-cell"><div class="info-label">Release Date</div><div class="info-value">${game.info.releaseDate}</div></div>
        </div>
      `;

      const downloads = document.getElementById('tab-downloads');
      if (game.downloads && game.downloads.length > 0) {
        downloads.innerHTML = game.downloads.map(d => `
          <div class="download-card">
            <div class="download-header">
              <div class="download-platform">
                <span class="icon">${getPlatformIcon(d.platformKey)}</span>
                ${d.platform}
              </div>
              ${d.isLatest ? '<span class="badge badge-latest">LATEST</span>' : ''}
            </div>
            <div class="download-meta">
              <span><strong>${d.version}</strong></span>
              <span>·</span>
              <span>${d.size}</span>
              <span>·</span>
              <span>${d.date}</span>
            </div>
            <div class="download-filename">${d.filename}</div>
            <button class="btn btn-primary" onclick="window.open('${d.url}', '_blank')" style="width: 100%; justify-content: center;">
              <span class="icon">${ICONS.download}</span> ดาวน์โหลด ${d.platform}
            </button>
            ${d.note ? `<div class="download-note"><span class="icon">${ICONS.warning}</span> ${d.note}</div>` : ''}
          </div>
        `).join('');
      } else {
        downloads.innerHTML = '<p style="color: var(--text-muted);">ยังไม่มีไฟล์ดาวน์โหลด</p>';
      }

      const devlog = document.getElementById('tab-devlog');
      const sorted = [...game.devlog].sort((a, b) => b.day - a.day);
      devlog.innerHTML = `<div class="timeline">` + sorted.map(d => `
        <div class="timeline-item">
          <div class="timeline-dot ${d.version ? 'has-release' : ''}"></div>
          <div class="timeline-item-header">
            <span class="timeline-day">Day ${d.day}</span>
            ${d.version ? `<span class="badge badge-release">${d.version}</span>` : ''}
            ${d.isLatest ? '<span class="badge badge-latest">LATEST</span>' : ''}
          </div>
          <p class="timeline-note">${d.note}</p>
          ${d.date ? `<p class="timeline-date"><span class="icon">${ICONS.calendar}</span> ${d.date}</p>` : ''}
        </div>
      `).join('') + '</div>';

      const links = document.getElementById('tab-links');
      let linksHtml = '';
      if (game.links.taptap) linksHtml += `<a href="${game.links.taptap}" target="_blank" rel="noopener" class="link-card"><div class="link-card-icon">${ICONS.taptap}</div><div class="link-card-text"><div class="link-card-name">TapTap</div><div class="link-card-url">taptap.io</div></div><div class="link-card-arrow">${ICONS.externalLink}</div></a>`;
      if (game.links.itch) linksHtml += `<a href="${game.links.itch}" target="_blank" rel="noopener" class="link-card"><div class="link-card-icon">${ICONS.itch}</div><div class="link-card-text"><div class="link-card-name">Itch.io</div><div class="link-card-url">itch.io</div></div><div class="link-card-arrow">${ICONS.externalLink}</div></a>`;
      if (game.links.github) linksHtml += `<a href="${game.links.github}" target="_blank" rel="noopener" class="link-card"><div class="link-card-icon">${ICONS.github}</div><div class="link-card-text"><div class="link-card-name">GitHub</div><div class="link-card-url">github.com</div></div><div class="link-card-arrow">${ICONS.externalLink}</div></a>`;
      if (game.links.githubReleases) linksHtml += `<a href="${game.links.githubReleases}" target="_blank" rel="noopener" class="link-card"><div class="link-card-icon">${ICONS.package}</div><div class="link-card-text"><div class="link-card-name">GitHub Releases</div><div class="link-card-url">releases</div></div><div class="link-card-arrow">${ICONS.externalLink}</div></a>`;
      links.innerHTML = linksHtml || '<p style="color: var(--text-muted);">ไม่มีลิงก์ภายนอก</p>';

      initTabs();
    }

    function initTabs() {
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
          document.querySelectorAll('[id^="tab-"]').forEach(c => c.hidden = true);
          btn.classList.add('active');
          document.getElementById(btn.dataset.tab).hidden = false;
        });
      });
      document.querySelector('.tab-btn')?.click();
    }

    function getGameId() {
      const id = new URLSearchParams(location.search).get('id');
      if (!id) { location.href = '404.html'; return null; }
      return id;
    }

    async function init() {
      const studio = await fetchJSON(SITE.dataUrl.studio);
      const games = await fetchJSON(SITE.dataUrl.games);

      if (studio) renderNav(studio);
      if (studio) renderFooter(studio);

      const gameId = getGameId();
      if (gameId && games) {
        const game = games.find(g => g.id === gameId);
        if (!game) { location.href = '404.html'; return; }
        renderGame(game);
      }
    }

    init();
  </script>

  <nav class="navbar">
    <div class="navbar-inner">
      <div class="nav-logo" id="nav-logo">TAT<span>.</span></div>
      <ul class="nav-links" id="nav-links"></ul>
    </div>
  </nav>

  <section class="section">
    <div class="section-inner">
      <div id="game-hero" class="game-hero"></div>
    </div>
  </section>

  <section class="section">
    <div class="section-inner">
      <div class="tab-nav">
        <button class="tab-btn active" data-tab="tab-about">เกี่ยวกับ</button>
        <button class="tab-btn" data-tab="tab-downloads">ดาวน์โหลด</button>
        <button class="tab-btn" data-tab="tab-devlog">Devlog</button>
        <button class="tab-btn" data-tab="tab-links">ลิงก์</button>
      </div>

      <div id="tab-about" hidden></div>
      <div id="tab-downloads" hidden></div>
      <div id="tab-devlog" hidden></div>
      <div id="tab-links" hidden></div>
    </div>
  </section>

  <footer class="footer" id="footer"></footer>
</body>
</html>
