<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="404 - ไม่พบหน้านี้">
  <meta name="theme-color" content="#0D0D0D">
  <title>404 — ไม่พบหน้านี้ | TAT Studio</title>

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%23FF6B00'/><text x='50' y='60' font-size='60' font-weight='bold' fill='%23000'>T</text></svg>">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap');

    :root {
      --bg: #0D0D0D;
      --bg-card: #111111;
      --bg-subtle: #161616;
      --border: #242424;
      --accent: #FF6B00;
      --text: #E2E2E2;
      --text-sec: #A0A0A0;
      --text-muted: #6B6B6B;
      --radius-sm: 6px;
      --max-w: 1080px;
      --nav-h: 60px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; -webkit-font-smoothing: antialiased; }
    body { background: var(--bg); color: var(--text); font-family: "Inter", system-ui, sans-serif; font-size: 0.9375rem; line-height: 1.6; }
    h1, h2, h3 { font-family: "Space Grotesk", sans-serif; font-weight: 600; letter-spacing: -0.02em; }
    a { color: inherit; text-decoration: none; }
    svg { flex-shrink: 0; }

    .icon { display: inline-flex; align-items: center; justify-content: center; width: 1em; height: 1em; vertical-align: middle; }
    .icon svg { width: 100%; height: 100%; }

    .navbar {
      position: sticky;
      top: 0;
      z-index: 100;
      height: var(--nav-h);
      display: flex;
      align-items: center;
      padding: 0 24px;
      background: rgba(13, 13, 13, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }
    .navbar-inner { width: 100%; max-width: var(--max-w); margin: 0 auto; display: flex; align-items: center; gap: 32px; }
    .nav-logo { font-family: "Space Grotesk", sans-serif; font-weight: 700; font-size: 1rem; color: var(--text); }
    .nav-logo span { color: var(--accent); }

    .container {
      min-height: calc(100vh - var(--nav-h));
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      text-align: center;
    }
    .container-inner { max-width: 500px; }

    .error-code {
      font-family: "Space Grotesk", sans-serif;
      font-size: 6rem;
      font-weight: 700;
      color: var(--accent);
      line-height: 1;
      margin-bottom: 24px;
    }
    .error-title {
      font-size: 1.75rem;
      margin-bottom: 12px;
      color: var(--text);
    }
    .error-desc {
      color: var(--text-sec);
      margin-bottom: 40px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 18px;
      border-radius: var(--radius-sm);
      font-family: "Inter", sans-serif;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.15s;
      background: var(--accent);
      color: #000;
      border: 1px solid var(--accent);
    }
    .btn:hover { opacity: 0.88; }
    .btn svg { width: 1rem; height: 1rem; }

    .footer {
      padding: 40px 24px;
      text-align: center;
      border-top: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 0.8125rem;
    }
  </style>
</head>
<body>
  <script>
    const ICONS = {
      arrowLeft: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>`,
    };
  </script>

  <nav class="navbar">
    <div class="navbar-inner">
      <a href="index.html" class="nav-logo">TAT<span>.</span></a>
    </div>
  </nav>

  <div class="container">
    <div class="container-inner">
      <div class="error-code">404</div>
      <h1 class="error-title">ไม่พบหน้านี้</h1>
      <p class="error-desc">หน้าที่คุณกำลังค้นหาอาจถูกย้าย ลบ หรือไม่เคยมีอยู่</p>
      <a href="index.html" class="btn">
        <span class="icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </span>
        กลับหน้าแรก
      </a>
    </div>
  </div>

  <footer class="footer">
    &copy; 2026 TimeAndTime Studio. All rights reserved.
  </footer>
</body>
</html>
